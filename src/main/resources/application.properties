spring.application.name=huellitas

# la base de datos está en nube en neon.tech en... sao paulo xdd
# las credenciales se leen desde variables de entorno locales
# 1. se crea un .env y copypaste del .env.example a ese .env creado
# 2. NUNCA y repito NUNCA se sube el archivo .env al repositorio, está configurado
# 3. pide la contraseña de la bd para colocar en el .env

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# para que la cosa conecte con el flyway
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8080

# por si la wbda del env no funciona
spring.config.import=optional:file:.env[.properties]