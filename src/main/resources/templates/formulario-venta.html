<html th:replace="~{layout :: page('Nueva Venta', 'ventas', ~{::main}, ~{})}">
<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <a th:href="@{/ventas}" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0">Nueva Venta</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm border-0 p-4">
                <div th:if="${errorMsg}" class="alert alert-danger">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>
                    <span th:text="${errorMsg}"></span>
                </div>

                <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post" id="formVenta">

                    <!-- DATOS GENERALES -->
                    <h6 class="fw-bold text-muted mb-3 pb-2 border-bottom">
                        <i class="fa-solid fa-receipt me-1"></i> Datos de la Venta
                    </h6>
                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Vendedor (Personal) *</label>
                            <select th:field="*{personal}" class="form-select" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option th:each="p : ${personal}" th:value="${p.id}" th:text="${p.nombreCompleto}"></option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Cliente (Opcional)</label>
                            <select th:field="*{propietario}" class="form-select">
                                <option value="">-- Público General --</option>
                                <option th:each="c : ${propietarios}" th:value="${c.id}" th:text="${c.nombreCompleto + ' (' + c.dni + ')'}"></option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Método de Pago *</label>
                            <select name="metodoPago" class="form-select" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="TARJETA">Tarjeta</option>
                                <option value="TRANSFERENCIA">Transferencia</option>
                            </select>
                        </div>
                    </div>

                    <!-- DETALLES DE PRODUCTOS -->
                    <div class="d-flex justify-content-between align-items-end mb-3 pb-2 border-bottom">
                        <h6 class="fw-bold text-muted m-0">
                            <i class="fa-solid fa-box me-1"></i> Detalle de Productos
                        </h6>
                        <button type="button" class="btn btn-sm btn-success" id="btnAgregarProducto">
                            <i class="fa-solid fa-plus"></i> Agregar Fila
                        </button>
                    </div>
                    
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered align-middle" id="tablaDetalles">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th width="15%">Precio Unit. (S/)</th>
                                    <th width="15%">Cantidad</th>
                                    <th width="15%">Subtotal (S/)</th>
                                    <th width="5%"></th>
                                </tr>
                            </thead>
                            <tbody id="tbodyDetalles">
                                <!-- Filas dinámicas se insertan aquí -->
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3" class="text-end fw-bold">TOTAL VENTA:</td>
                                    <td class="fw-bold text-success fs-5">S/ <span id="lblTotal">0.00</span></td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/ventas}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4" id="btnSubmit">
                            <i class="fa-solid fa-save me-1"></i> Registrar Venta
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Template oculto para las filas -->
    <select id="productoTemplate" style="display:none;">
        <option value="" disabled selected data-precio="0" data-stock="0">Seleccione un producto...</option>
        <option th:each="prod : ${productos}" 
                th:value="${prod.id}" 
                th:data-precio="${prod.precioVenta}"
                th:data-stock="${prod.stockActual}"
                th:text="${prod.nombre + ' (Stock: ' + prod.stockActual + ')'}">
        </option>
    </select>

    <!-- Script de lógica de ventas -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tbody = document.getElementById('tbodyDetalles');
            const btnAgregar = document.getElementById('btnAgregarProducto');
            const templateOptions = document.getElementById('productoTemplate').innerHTML;
            const lblTotal = document.getElementById('lblTotal');

            function calcularTotal() {
                let total = 0;
                document.querySelectorAll('.fila-producto').forEach(fila => {
                    const precio = parseFloat(fila.querySelector('.precio-unitario').value) || 0;
                    const cantidad = parseInt(fila.querySelector('.input-cantidad').value) || 0;
                    const subtotal = precio * cantidad;
                    fila.querySelector('.subtotal-txt').textContent = subtotal.toFixed(2);
                    total += subtotal;
                });
                lblTotal.textContent = total.toFixed(2);
            }

            function agregarFila() {
                const tr = document.createElement('tr');
                tr.className = 'fila-producto';
                tr.innerHTML = `
                    <td>
                        <select name="productoId[]" class="form-select select-producto" required>
                            ${templateOptions}
                        </select>
                    </td>
                    <td>
                        <input type="text" class="form-control precio-unitario text-end" readonly value="0.00">
                    </td>
                    <td>
                        <input type="number" name="cantidad[]" class="form-control input-cantidad" min="1" value="1" required>
                        <small class="text-danger stock-warning d-none" style="font-size:0.75rem;">Stock excedido</small>
                    </td>
                    <td class="text-end fw-bold text-secondary">
                        S/ <span class="subtotal-txt">0.00</span>
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-sm btn-outline-danger btn-eliminar">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;

                // Eventos de la fila
                tr.querySelector('.select-producto').addEventListener('change', function(e) {
                    const selected = e.target.options[e.target.selectedIndex];
                    tr.querySelector('.precio-unitario').value = parseFloat(selected.dataset.precio || 0).toFixed(2);
                    tr.querySelector('.input-cantidad').max = selected.dataset.stock;
                    calcularTotal();
                });

                tr.querySelector('.input-cantidad').addEventListener('input', function(e) {
                    const max = parseInt(this.max);
                    const val = parseInt(this.value);
                    const warning = tr.querySelector('.stock-warning');
                    if (val > max) {
                        warning.classList.remove('d-none');
                        this.classList.add('is-invalid');
                    } else {
                        warning.classList.add('d-none');
                        this.classList.remove('is-invalid');
                    }
                    calcularTotal();
                });

                tr.querySelector('.btn-eliminar').addEventListener('click', function() {
                    tr.remove();
                    calcularTotal();
                });

                tbody.appendChild(tr);
            }

            // Inicializar con 1 fila obligatoria
            agregarFila();

            btnAgregar.addEventListener('click', agregarFila);
            
            // Prevenir submit si no hay filas o hay errores de stock
            document.getElementById('formVenta').addEventListener('submit', function(e) {
                if (document.querySelectorAll('.fila-producto').length === 0) {
                    e.preventDefault();
                    alert('Debe agregar al menos un producto a la venta.');
                    return;
                }
                if (document.querySelectorAll('.is-invalid').length > 0) {
                    e.preventDefault();
                    alert('Corrija las cantidades que exceden el stock disponible.');
                }
            });
        });
    </script>
</main>
</html>
