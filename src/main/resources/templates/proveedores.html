<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Proveedores - Huellitas</title>
</head>

<body>

<!-- Navbar -->
<div th:replace="~{layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <nav th:replace="~{layout :: sidebar('proveedores')}"></nav>

        <!-- Contenido Principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h2 class="fw-bold">GESTIÓN DE PROVEEDORES</h2>
                    <p class="text-muted mb-0">
                        Registro y administración de proveedores veterinarios
                    </p>
                </div>
            </div>

            <!-- FORMULARIO -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4">

                    <h5 class="fw-bold text-primary mb-4">
                        Registrar proveedor
                    </h5>

                    <form th:action="@{/proveedores/guardar}"
                          th:object="${nuevoProveedor}"
                          method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row">

                            <!-- Imagen -->
                            <div class="col-md-3 text-center border-end">

                                <p class="text-muted small">
                                    Imagen Referencial
                                </p>

                                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                                     class="img-fluid mb-3"
                                     style="max-width: 180px;">

                                <div>
                                    <button type="button"
                                            class="btn btn-outline-secondary btn-sm">
                                        Subir
                                    </button>
                                </div>

                            </div>

                            <!-- Campos -->
                            <div class="col-md-9">

                                <div class="mb-3">
                                    <label class="form-label">
                                        Razón Social
                                    </label>

                                   <input type="text"
                                    th:field="*{razonSocial}"
                                    class="form-control"
                                    placeholder="Nombre de la empresa"
                                    pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                                    title="Solo se permiten letras"
                                    required>
                                </div>

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">
                                            RUC
                                        </label>

                                        <input type="text"
                                               th:field="*{ruc}"
                                               class="form-control"
                                               placeholder="20123456789"
                                               pattern="[0-9]{11}"
                                               maxlength="11"
                                               minlength="11"
                                               required>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">
                                            Teléfono
                                        </label>

                                        <input type="text"
                                               th:field="*{telefono}"
                                               class="form-control"
                                               placeholder="999999999"
                                               pattern="[0-9]{9}"
                                               maxlength="9"
                                               minlength="9">

                                    </div>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Contacto
                                    </label>

                                    <input type="text"
                                    th:field="*{contacto}"
                                    class="form-control"
                                    placeholder="Nombre del representante"
                                    oninput="this.value=this.value.replace(/[^a-zA-ZÁÉÍÓÚáéíóúÑñ ]/g,'')">

                                </div>

                                <div th:if="${session.usuario.cargo == 'ADMINISTRADOR'}"
                                class="mt-4 text-start">
                                    <button type="submit" class="btn btn-primary">

                                    <span th:if="${nuevoProveedor.id == null}">
                                    Registrar
                                    </span>

                                    <span th:if="${nuevoProveedor.id != null}">
                                    Actualizar
                                    </span>
                                    </button>
                                </div>

                            </div>

                        </div>

                    </form>

                </div>
            </div>

            <!-- TABLA -->
            <div class="card shadow-sm border-0">

                <div class="card-header">
                    <h5 class="mb-0 fw-bold">
                        Proveedores Registrados
                    </h5>
                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table align-middle">

                            <thead>
                            <tr>
                                <th>RUC</th>
                                <th>Razón Social</th>
                                <th>Contacto</th>
                                <th>Teléfono</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="p : ${listaProveedores}">

                                <td th:text="${p.ruc}"></td>

                                <td th:text="${p.razonSocial}"></td>

                                <td th:text="${p.contacto}"></td>

                                <td th:text="${p.telefono}"></td>

                            <td>

                                <div th:if="${session.usuario.cargo == 'ADMINISTRADOR'}">

    <a th:href="@{/proveedores/editar/{id}(id=${p.id})}"
       class="btn btn-warning btn-sm">
       Editar
    </a>

</div>

                                <div th:if="${session.usuario.cargo == 'ADMINISTRADOR'}">

    <a th:href="@{/proveedores/eliminar/{id}(id=${p.id})}"
       class="btn btn-danger btn-sm">
       Eliminar
    </a>

</div>

                            </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(listaProveedores)}">
                                <td colspan="5" class="text-center text-muted">
                                    No existen proveedores registrados.
                                </td>
                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </main>

    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
