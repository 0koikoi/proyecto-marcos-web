<html th:replace="~{layout :: page('Proveedores', 'proveedores', ~{::main}, ~{})}">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold">Gestión de Proveedores</h2>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Formulario de nuevo proveedor -->
        <div class="col-lg-4">
            <div class="card p-4 shadow-sm border-0">
                <h5 class="fw-bold mb-4">Nuevo Proveedor</h5>
                <form th:action="@{/proveedores/guardar}" th:object="${nuevoProveedor}" method="post">
                    <div class="mb-3">
                        <label class="form-label">RUC</label>
                        <input type="text" th:field="*{ruc}" class="form-control"
                               placeholder="Ej: 20123456789" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Razón Social</label>
                        <input type="text" th:field="*{razonSocial}" class="form-control"
                               placeholder="Nombre de la empresa" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contacto</label>
                        <input type="text" th:field="*{contacto}" class="form-control"
                               placeholder="Nombre del representante">
                        <div class="text-danger small" th:if="${#fields.hasErrors('contacto')}" th:errors="*{contacto}"></div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control"
                               placeholder="999 999 999">
                        <div class="text-danger small" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar Proveedor</button>
                </form>
            </div>
        </div>

        <!-- Tabla de proveedores -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">RUC</th>
                                <th>Razón Social</th>
                                <th>Contacto</th>
                                <th>Teléfono</th>
                                <th class="text-center pe-4">Acción</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${listaProveedores}">
                                <td class="ps-4 fw-bold" th:text="${p.ruc}"></td>
                                <td th:text="${p.razonSocial}"></td>
                                <td th:text="${p.contacto}"></td>
                                <td th:text="${p.telefono}"></td>
                                <td class="text-center pe-4">
                                    <!-- Eliminar: POST para proteger CSRF -->
                                    <form th:action="@{/proveedores/eliminar/{id}(id=${p.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('¿Eliminar este proveedor?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fa-solid fa-trash me-1"></i> Eliminar
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listaProveedores)}">
                                <td colspan="5" class="text-center text-muted py-5">
                                    <i class="fa-solid fa-truck-fast fa-2x mb-2 d-block"></i>
                                    No hay proveedores registrados.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</html>
