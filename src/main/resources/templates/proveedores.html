<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Proveedores - Huellitas</title>
</head>
<body class="bg-light">

<div th:replace="~{layout :: navbar}"></div>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('proveedores')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <h2 class="fw-bold mb-4 border-bottom pb-3">GESTIÓN DE PROVEEDORES</h2>

            <div class="row">
                <div class="col-lg-4 mb-4">
                    <div class="card p-4 shadow-sm">
                        <h5 class="mb-4">Nuevo Proveedor</h5>
                        <form th:action="@{/proveedores/guardar}" th:object="${nuevoProveedor}" method="post">
                            <div class="mb-3">
                                <label class="form-label">RUC</label>
                                <input type="text" th:field="*{ruc}" class="form-control" placeholder="Ej: 20123456789" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Razón Social</label>
                                <input type="text" th:field="*{razonSocial}" class="form-control" placeholder="Nombre de la empresa" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contacto</label>
                                <input type="text" th:field="*{contacto}" class="form-control" placeholder="Nombre del representante">
                                <div class="text-danger" th:if="${#fields.hasErrors('contacto')}" th:errors="*{contacto}"></div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Teléfono</label>
                                <input type="text" th:field="*{telefono}" class="form-control" placeholder="999 999 999">
                                <div class="text-danger" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar Proveedor</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card p-4 shadow-sm">
                        <h5 class="mb-4">Proveedores Registrados</h5>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th>RUC</th>
                                    <th>Razón Social</th>
                                    <th>Contacto</th>
                                    <th>Teléfono</th>
                                    <th>Acción</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="p : ${listaProveedores}">
                                    <td class="fw-bold" th:text="${p.ruc}"></td>
                                    <td th:text="${p.razonSocial}"></td>
                                    <td th:text="${p.contacto}"></td>
                                    <td th:text="${p.telefono}"></td>
                                    <td>
                                        <a th:href="@{/proveedores/eliminar/{id}(id=${p.id})}" class="btn btn-sm btn-danger">Eliminar</a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
