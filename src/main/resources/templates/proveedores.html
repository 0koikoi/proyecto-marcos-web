<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Proveedores - Huellitas</title>
</head>

<body class="bg-light">

<div th:replace="~{layout :: header-mobile}"></div>

<div class="container-fluid">
    <div class="row">

        <nav th:replace="~{layout :: sidebar('proveedores')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

            <h2 class="fw-bold border-bottom pb-3 mb-4">
                Gestión de Proveedores
            </h2>

            <!-- FORMULARIO -->
            <div class="card shadow border-0 mb-5">
                <div class="card-body p-4">

                    <h5 class="fw-bold text-primary mb-4">
                        Registrar Proveedor
                    </h5>

                    <form th:action="@{/proveedores/guardar}"
                          th:object="${nuevoProveedor}"
                          method="post"
                          class="row g-3">

                        <div class="col-md-3">
                            <label class="form-label">RUC</label>
                            <input type="text"
                                   th:field="*{ruc}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Razón Social</label>
                            <input type="text"
                                   th:field="*{razonSocial}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Contacto</label>
                            <input type="text"
                                   th:field="*{contacto}"
                                   class="form-control">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Teléfono</label>
                            <input type="text"
                                   th:field="*{telefono}"
                                   class="form-control">
                        </div>

                        <div class="col-12">
                            <button type="submit"
                                    class="btn btn-primary px-4">
                                Guardar Proveedor
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <!-- TABLA -->
            <div class="card shadow border-0">
                <div class="card-body">

                    <h5 class="fw-bold mb-4 text-secondary">
                        Lista de Proveedores
                    </h5>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>RUC</th>
                                <th>Razón Social</th>
                                <th>Contacto</th>
                                <th>Teléfono</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="proveedor : ${listaProveedores}">

                                <td th:text="${proveedor.id}"></td>
                                <td th:text="${proveedor.ruc}"></td>
                                <td th:text="${proveedor.razonSocial}"></td>
                                <td th:text="${proveedor.contacto}"></td>
                                <td th:text="${proveedor.telefono}"></td>

                                <td>
                                    <a th:href="@{/proveedores/eliminar/{id}(id=${proveedor.id})}"
                                       class="btn btn-danger btn-sm">
                                        Eliminar
                                    </a>
                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>
                </div>
            </div>

        </main>

    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
