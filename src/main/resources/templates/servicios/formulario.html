<html th:replace="~{layout :: page('Formulario Servicio', 'servicios', ~{::main}, ~{})}">

<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <a th:href="@{/servicios}" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0"
            th:text="${servicio.id == null} ? 'Registrar Nuevo Servicio' : 'Editar Servicio'">
            Servicio
        </h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 p-4">
                <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Nombre del Servicio</label>
                        <select th:field="*{nombre}" class="form-select" required>
                            <option value="" disabled selected>Seleccione un servicio...</option>
                            <option value="Consulta General">Consulta General</option>
                            <option value="Consulta de Urgencia">Consulta de Urgencia</option>
                            <option value="Vacunación">Vacunación</option>
                            <option value="Desparasitación">Desparasitación</option>
                            <option value="Baño y Corte Básico">Baño y Corte Básico</option>
                            <option value="Baño y Corte Premium">Baño y Corte Premium</option>
                            <option value="Cirugía Menor">Cirugía Menor</option>
                            <option value="Cirugía Mayor">Cirugía Mayor</option>
                            <option value="Esterilización (hembra)">Esterilización (hembra)</option>
                            <option value="Esterilización (macho)">Esterilización (macho)</option>
                            <option value="Radiografía">Radiografía</option>
                            <option value="Ecografía">Ecografía</option>
                            <option value="Análisis de Laboratorio">Análisis de Laboratorio</option>
                            <option value="Hospitalización (día)">Hospitalización (día)</option>
                            <option value="Odontología Básica">Odontología Básica</option>
                        </select>
                        <small class="text-muted">Elija uno de los servicios estándar de la clínica.</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="3"
                                  placeholder="Añada detalles o notas del servicio..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Precio (S/)</label>
                        <input type="number" step="0.01" min="0" th:field="*{precio}" class="form-control"
                               required placeholder="0.00">
                    </div>

                    <div class="d-flex gap-2 pt-3 border-top">
                        <button type="submit" class="btn btn-success">
                            <i class="fa-solid fa-save me-1"></i> Guardar
                        </button>
                        <a th:href="@{/servicios}" class="btn btn-outline-secondary">
                            <i class="fa-solid fa-times me-1"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

</html>
