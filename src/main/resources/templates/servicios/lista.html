<html th:replace="~{layout :: page('Servicios', 'servicios', ~{::main}, ~{})}">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold">Gestión de Servicios</h2>
        <a th:href="@{/servicios/nuevo}" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Nuevo Servicio
        </a>
    </div>

    <div th:replace="~{layout :: alerts}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Nombre</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th class="text-center pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${servicios}">
                        <td class="ps-4 fw-semibold" th:text="${s.nombre}"></td>
                        <td class="text-muted" th:text="${s.descripcion}"></td>
                        <td th:text="'S/ ' + ${s.precio}"></td>
                        <td>
                            <span th:if="${s.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${s.activo}" class="badge bg-secondary">Inactivo</span>
                        </td>
                        <td class="text-center pe-4">
                            <a th:href="@{/servicios/editar/{id}(id=${s.id})}" class="btn btn-sm btn-outline-warning">
                                <i class="fa-solid fa-pen me-1"></i> Editar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(servicios)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="fa-solid fa-briefcase-medical fa-2x mb-2 d-block"></i>
                            No hay servicios registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</html>
