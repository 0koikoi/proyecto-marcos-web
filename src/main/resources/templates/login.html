<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Huellitas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <style>
        /* Centrado absoluto para el login */
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f8fafc; }
        .login-card { width: 100%; max-width: 400px; padding: 2.5rem; }
        .brand-logo { color: #4f46e5; font-weight: 700; font-size: 2rem; letter-spacing: -1px; text-align: center; margin-bottom: 2rem; }
    </style>
</head>
<body>

<div class="card login-card shadow-lg border-0">
    <div class="brand-logo">Huellitas.</div>
    <h5 class="text-center text-muted mb-4 fw-normal">Inicia sesión en tu cuenta</h5>

    <form th:action="@{/dashboard}" method="get">
        <div class="mb-3">
            <label class="form-label text-muted small">Usuario</label>
            <input type="text" class="form-control" placeholder="ej: admin" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-muted small">Contraseña</label>
            <input type="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Ingresar al Sistema</button>
    </form>

    <div class="text-center mt-4">
        <p class="small text-muted mb-0">yapeame</p>
    </div>
</div>

</body>
</html>
