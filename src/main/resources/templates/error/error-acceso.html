<html th:replace="~{layout :: page('Acceso Denegado', 'dashboard', ~{::main}, ~{::#custom-scripts})}">
<main>
    <div class="d-flex justify-content-center align-items-center" style="min-height: 65vh;">
        <div class="card border-0 shadow-sm text-center p-5" style="max-width: 500px; width: 100%; border-top: 4px solid var(--danger) !important;">
            <div class="mb-4">
                <i class="fa-solid fa-ban fa-4x text-danger"></i>
            </div>
            <h4 class="fw-bold mb-3">Acceso Denegado</h4>
            <p class="text-muted mb-4" th:text="${errorMsg}">
                No tienes permiso para acceder a este recurso.
            </p>
            <a th:href="@{/dashboard}" class="btn btn-danger w-100 py-2 fw-medium">
                <i class="fa-solid fa-house me-2"></i> Ir al Dashboard
            </a>
        </div>
    </div>
</main>
<th:block id="custom-scripts">
</th:block>
</html>
