<html th:replace="~{layout :: page('Error Interno', 'dashboard', ~{::main}, ~{::#custom-scripts})}">
<main>
    <div class="d-flex justify-content-center align-items-center" style="min-height: 65vh;">
        <div class="card border-0 shadow-sm text-center p-5" style="max-width: 500px; width: 100%; border-top: 4px solid var(--danger) !important;">
            <div class="mb-4">
                <i class="fa-solid fa-bug fa-4x text-danger"></i>
            </div>
            <h4 class="fw-bold mb-3">Error del Sistema</h4>
            <p class="text-muted mb-4" th:text="${errorMsg}">
                Ocurrió un error inesperado. Por favor, contacta al administrador.
            </p>
            <div th:if="${detallesError}" class="alert alert-warning text-start" style="font-family: monospace; font-size: 0.85rem; word-break: break-all;">
                <strong class="d-block mb-1">Detalles del error:</strong>
                <span th:text="${detallesError}"></span>
            </div>
            <a th:href="@{/dashboard}" class="btn btn-secondary w-100 py-2 fw-medium">
                <i class="fa-solid fa-house me-2"></i> Volver al Inicio
            </a>
        </div>
    </div>
</main>
<th:block id="custom-scripts">
</th:block>
</html>
