<html th:replace="~{layout :: page('Inventario de Productos', 'productos', ~{::main}, ~{})}">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold">Inventario de Productos</h2>
    </div>

    <div th:replace="~{layout :: alerts}"></div>

    <div class="row g-4">
        <!-- Formulario de nuevo producto -->
        <div class="col-lg-4">
            <div class="card p-4 shadow-sm border-0">
                <h5 class="fw-bold mb-4">Nuevo Producto</h5>
                <form th:action="@{/productos/guardar}" th:object="${nuevoProducto}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoría</label>
                        <input type="text" th:field="*{categoria}" class="form-control" placeholder="Ej. Alimentos, Medicinas">
                    </div>
                    <div class="row">
                        <div class="col-12 mb-3">
                            <label class="form-label">P. Venta</label>
                            <input type="number" step="0.01" th:field="*{precioVenta}" class="form-control" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-4">
                            <label class="form-label">Stock Actual</label>
                            <input type="number" th:field="*{stockActual}" class="form-control" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('stockActual')}" th:errors="*{stockActual}"></div>
                        </div>
                        <div class="col-6 mb-4">
                            <label class="form-label">Stock Mínimo</label>
                            <input type="number" th:field="*{stockMinimo}" class="form-control" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
                </form>
            </div>
        </div>

        <!-- Tabla de inventario -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">Nombre</th>
                                <th>Categoría</th>
                                <th>P. Venta</th>
                                <th>Stock</th>
                                <th class="text-center pe-4">Acción</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="producto : ${listaProductos}">
                                <td class="ps-4 fw-semibold" th:text="${producto.nombre}"></td>
                                <td th:text="${producto.categoria != null ? producto.categoria : '—'}"></td>
                                <td th:text="'S/ ' + ${producto.precioVenta}"></td>
                                <td>
                                    <span th:text="${producto.stockActual}"
                                          th:class="${producto.stockActual <= producto.stockMinimo} ? 'badge bg-danger' : 'badge bg-success'">
                                    </span>
                                </td>
                                <td class="text-center pe-4">
                                    <!-- Eliminar: POST para proteger CSRF -->
                                    <form th:action="@{/productos/eliminar/{id}(id=${producto.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('¿Eliminar este producto del inventario?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fa-solid fa-trash me-1"></i> Eliminar
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listaProductos)}">
                                <td colspan="5" class="text-center text-muted py-5">
                                    <i class="fa-solid fa-box-open fa-2x mb-2 d-block"></i>
                                    No hay productos registrados.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</html>
