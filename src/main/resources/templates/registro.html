<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Registro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow p-4">

<h3 class="text-center mb-4">

Registro de Usuario

</h3>

<form th:action="@{/registro}"
      th:object="${usuario}"
      method="post">

<div class="mb-3">

<input type="text"
       th:field="*{codigoInstitucional}"
       placeholder="Código"
       class="form-control">

</div>

<div class="mb-3">

<input type="text"
       th:field="*{nombreCompleto}"
       placeholder="Nombre Completo"
       class="form-control">

</div>

<div class="mb-3">

<select th:field="*{cargo}"
        class="form-select">

<option value="VETERINARIO">
Veterinario
</option>

<option value="RECEPCION">
Recepción
</option>

<option value="ADMINISTRADOR">
Administrador
</option>

</select>

</div>

<div class="mb-3">

<input type="text"
       th:field="*{telefono}"
       placeholder="Teléfono"
       class="form-control">

</div>

<div class="mb-3">

<input type="text"
       th:field="*{username}"
       placeholder="Usuario"
       class="form-control">

</div>

<div class="mb-3">

<input type="password"
       th:field="*{passwordHash}"
       placeholder="Contraseña"
       class="form-control">

</div>

<button class="btn btn-success w-100">

Registrarse

</button>

</form>

</div>

</div>

</div>

</div>

</body>
</html>
