<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Ventas - Huellitas</title>
</head>
<body class="bg-light">

<div th:replace="~{layout :: navbar}"></div>
<div class="container-fluid" style="padding-top: 60px;">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('ventas')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h2 class="fw-bold">REGISTRO DE VENTAS</h2>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/ventas/nuevo}" class="btn btn-primary shadow-sm">
                        <i class="fa-solid fa-plus"></i> Nueva Venta
                    </a>
                </div>
            </div>

            <div class="card p-0 shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4 py-3">Nro Boleta</th>
                            <th class="py-3">Fecha</th>
                            <th class="py-3">Cliente</th>
                            <th class="py-3">Vendedor</th>
                            <th class="py-3 text-end pe-4">Total</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="venta : ${ventas}">
                            <td class="ps-4 fw-bold text-secondary" th:text="${venta.nroBoleta}"></td>
                            <td th:text="${#temporals.format(venta.fechaEmision, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${venta.propietario != null ? venta.propietario.nombre + ' ' + venta.propietario.apellido : 'Público General'}"></td>
                            <td th:text="${venta.personal != null ? venta.personal.nombre + ' ' + venta.personal.apellido : ''}"></td>
                            <td class="text-end pe-4 fw-bold text-success" th:text="'S/ ' + ${venta.total}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ventas)}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <i class="fa-solid fa-box-open fa-2x mb-3 text-secondary"></i><br>
                                No hay ventas registradas aún.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
