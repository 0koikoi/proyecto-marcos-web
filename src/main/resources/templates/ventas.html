<html th:replace="~{layout :: page('Ventas', 'ventas', ~{::main}, ~{})}"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold">Registro de Ventas</h2>
        <a th:href="@{/ventas/nuevo}" class="btn btn-primary" sec:authorize="hasRole('RECEPCION')">
            <i class="fa-solid fa-plus me-1"></i> Nueva Venta
        </a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filtro -->
    <div class="card shadow-sm border-0 mb-4 p-3 bg-light">
        <form th:action="@{/ventas}" method="get" class="row align-items-end g-3">
            <div class="col-md-3">
                <label class="form-label fw-bold">Filtrar por Estado:</label>
                <select name="estado" class="form-select">
                    <option value="">Todas las Ventas</option>
                    <option th:each="est : ${estados}" 
                            th:value="${est}" 
                            th:text="${est}" 
                            th:selected="${est == estadoFiltro}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-secondary w-100">
                    <i class="fa-solid fa-filter me-1"></i> Aplicar
                </button>
            </div>
        </form>
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Nro. Boleta</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>M. Pago</th>
                        <th>Vendedor</th>
                        <th>Estado</th>
                        <th class="text-end">Total</th>
                        <th class="text-center pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td class="ps-4 fw-bold text-secondary" th:text="'#' + ${venta.id}"></td>
                        <td th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${venta.propietario != null ? venta.propietario.nombreCompleto : 'Público General'}"></td>
                        <td th:text="${venta.tipoPago != null ? venta.tipoPago : 'EFECTIVO'}"></td>
                        <td th:text="${venta.personal != null ? venta.personal.nombreCompleto : '—'}"></td>
                        <td>
                            <span th:text="${venta.estado}"
                                  th:class="${venta.estado.name() == 'PAGADA'}   ? 'badge bg-success'
                                           : (${venta.estado.name() == 'PENDIENTE'} ? 'badge bg-warning text-dark'
                                           : 'badge bg-danger')">
                            </span>
                        </td>
                        <td class="text-end fw-bold text-success" th:text="'S/ ' + ${venta.total}"></td>
                        <td class="text-center pe-4 d-flex justify-content-center gap-2">
                            
                            <a th:href="@{/ventas/{id}/detalle(id=${venta.id})}" class="btn btn-sm btn-info text-white" title="Ver Detalle">
                                <i class="fa-solid fa-eye"></i>
                            </a>

                            <form th:if="${venta.estado.name() == 'PENDIENTE'}" 
                                  th:action="@{/ventas/{id}/anular(id=${venta.id})}" 
                                  method="post" 
                                  style="display:inline;"
                                  onsubmit="return confirm('¿Está seguro de que desea ANULAR esta venta? El stock será devuelto al inventario.');">
                                <button type="submit" class="btn btn-sm btn-danger" title="Anular">
                                    <i class="fa-solid fa-ban"></i>
                                </button>
                            </form>

                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="fa-solid fa-box-open fa-2x mb-3 d-block text-secondary"></i>
                            No se encontraron ventas registradas.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</html>
