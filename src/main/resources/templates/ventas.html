<html th:replace="~{layout :: page('Ventas', 'ventas', ~{::main}, ~{})}">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold">Registro de Ventas</h2>
        <a th:href="@{/ventas/nuevo}" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Nueva Venta
        </a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Nro. Boleta</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Vendedor</th>
                        <th>Estado</th>
                        <th class="text-end pe-4">Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td class="ps-4 fw-bold text-secondary" th:text="${venta.nroBoleta}"></td>
                        <td th:text="${#temporals.format(venta.fechaEmision, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${venta.propietario != null ? venta.propietario.nombreCompleto : 'Público General'}"></td>
                        <td th:text="${venta.personal != null ? venta.personal.nombreCompleto : '—'}"></td>
                        <td>
                            <span th:text="${venta.estado}"
                                  th:class="${venta.estado.name() == 'PAGADA'}   ? 'badge bg-success'
                                           : (${venta.estado.name() == 'PENDIENTE'} ? 'badge bg-warning text-dark'
                                           : 'badge bg-danger')">
                            </span>
                        </td>
                        <td class="text-end pe-4 fw-bold text-success" th:text="'S/ ' + ${venta.total}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="fa-solid fa-box-open fa-2x mb-3 d-block text-secondary"></i>
                            No hay ventas registradas aún.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</html>
