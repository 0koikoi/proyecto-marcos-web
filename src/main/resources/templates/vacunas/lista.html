<html th:replace="~{layout :: page('Vacunas', 'vacunas', ~{::main}, ~{})}"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="fa-solid fa-syringe me-2"></i>Vacunas
                <span th:if="${paciente != null}" class="text-muted fs-5 fw-normal"
                      th:text="'— ' + ${paciente.nombre}"></span>
            </h2>
            <p class="text-muted small mb-0">Control de vacunación de los pacientes</p>
        </div>
        <a th:href="@{/vacunas/nueva}" sec:authorize="hasAnyRole('ADMINISTRADOR','VETERINARIO')"
           class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Registrar Vacuna
        </a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${infoMsg}" class="alert alert-info alert-dismissible fade show">
        <span th:text="${infoMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- TODO: Implementar tabla con vacunas
    COLUMNAS ESPERADAS:
        Paciente | Vacuna | Laboratorio | Lote | Fecha Aplicación | Próxima Dosis | Vet | Acciones

    RESALTAR próxima dosis próxima (< 7 días):
        th:class="${vacuna.fechaProximaDosis != null and vacuna.fechaProximaDosis.isBefore(fechaLimite)} ? 'text-warning fw-bold' : ''"
    -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="alert alert-warning mb-0">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>
                <strong>Módulo en construcción.</strong>
                Implementar la tabla en <code>VacunaController.java</code>.
            </div>
        </div>
    </div>
</main>

</html>
