<html th:replace="~{layout :: page('Recetas Médicas', 'recetas', ~{::main}, ~{})}"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold mb-0">
            <i class="fa-solid fa-prescription me-2"></i> Recetas Médicas
        </h2>
        <a th:href="@{/recetas/nueva}" sec:authorize="hasAnyRole('ADMINISTRADOR','VETERINARIO')"
           class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Nueva Receta
        </a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${infoMsg}" class="alert alert-info alert-dismissible fade show">
        <span th:text="${infoMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- TODO: Implementar tabla de recetas
    COLUMNAS: # Receta | Fecha | Paciente | Veterinario | N° Medicamentos | Acciones (Ver | Eliminar)
    -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="alert alert-warning mb-0">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>
                <strong>Módulo en construcción.</strong>
                Implementar la tabla en <code>RecetaController.java</code>.
            </div>
        </div>
    </div>
</main>

</html>
