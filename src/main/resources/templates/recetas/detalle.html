<html th:replace="~{layout :: page('Detalle de Receta', 'recetas', ~{::main}, ~{::#custom-scripts})}"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3 no-print">
        <a th:href="@{/recetas}" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0">Detalle de Receta</h2>
    </div>

    <!--
    TODO: Implementar vista de detalle/impresión de la receta.

    SECCIONES:
        1. Encabezado de la clínica (nombre, dirección, teléfono — hardcoded o desde config)
        2. Datos del paciente (nombre, especie, raza, propietario)
        3. Datos del veterinario firmante (nombre, especialidad, código institucional)
        4. Fecha de emisión
        5. Tabla de medicamentos (DetalleReceta):
           - Medicamento | Presentación | Dosis | Frecuencia | Duración | Cantidad
        6. Observaciones generales
        7. Firma y sello del veterinario (línea punteada)

    ACCIONES:
        - Botón Imprimir: todos los roles (llama window.print())
        - Botón Eliminar: solo ADMINISTRADOR con form POST + token CSRF
            <form th:action="@{/recetas/eliminar/{id}(id=${receta.id})}" method="post"
                  sec:authorize="hasRole('ADMINISTRADOR')"
                  onsubmit="return confirm('¿Eliminar esta receta?')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-danger btn-sm no-print">Eliminar</button>
            </form>

    MODELO ESPERADO EN EL CONTROLLER:
        model.addAttribute("receta", receta);
        (DetalleReceta se accede como receta.detalles en Thymeleaf)
    -->

    <div class="alert alert-warning">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <strong>Módulo en construcción.</strong>
        Implementar la vista de detalle/impresión de la receta en <code>RecetaController.java</code>.
    </div>

    <div class="d-flex gap-2 no-print">
        <a th:href="@{/recetas}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver
        </a>
        <button class="btn btn-outline-primary" onclick="window.print()">
            <i class="fa-solid fa-print me-1"></i> Imprimir
        </button>
    </div>
</main>

<th:block id="custom-scripts">
<script>
    // No hay scripts específicos para esta vista (window.print() es inline intencional)
</script>
</th:block>

</html>
