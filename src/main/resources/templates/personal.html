<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Personal - Huellitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: menu-lateral}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <h2 class="fw-bold mb-4 border-bottom pb-3">EQUIPO MÉDICO Y STAFF</h2>

            <div th:if="${errorCodigo}" class="alert alert-danger" th:text="${errorCodigo}"></div>

            <div class="card p-4 shadow-sm mb-5">
                <h5>Registrar Nuevo Personal</h5>
                <form th:action="@{/personal/guardar}" th:object="${nuevoPersonal}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <input type="text" th:field="*{codigoInstitucional}" class="form-control" placeholder="Código (Ej: C123456)" required>
                    </div>
                    <div class="col-md-5">
                        <input type="text" th:field="*{nombreCompleto}" class="form-control" placeholder="Nombre Completo" required>
                    </div>
                    <div class="col-md-3">
                        <select th:field="*{cargo}" class="form-select" required>
                            <option value="Veterinario">Veterinario</option>
                            <option value="Recepción">Recepción</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100">Guardar</button>
                    </div>
                </form>
            </div>

            <div class="row">
                <div class="col-md-4" th:each="persona : ${listaPersonal}">
                    <div class="card p-4 shadow border-0 mb-3">
                        <h5 th:text="${persona.nombreCompleto}">Nombre</h5>
                        <p class="small text-primary mb-1" th:text="${persona.cargo}">Cargo</p>
                        <span class="badge bg-secondary" th:text="${persona.codigoInstitucional}">Código</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
