<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Personal - Huellitas</title>
</head>
<body class="bg-light">
<div th:replace="~{layout :: header-mobile}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('personal')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <h2 class="fw-bold mb-4 border-bottom pb-3">EQUIPO MÉDICO Y STAFF</h2>

            <div th:if="${errorCodigo}" class="alert alert-danger" th:text="${errorCodigo}"></div>

            <div class="card p-4 shadow-sm mb-5 border-0">
                <form th:action="@{/personal/guardar}" th:object="${nuevoPersonal}" method="post" class="row g-3">
                    <div class="col-md-2">
                        <input type="text" th:field="*{codigoInstitucional}" class="form-control" placeholder="C123456" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" th:field="*{nombreCompleto}" class="form-control" placeholder="Nombre Completo" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" th:field="*{username}" class="form-control" placeholder="Usuario Login" required>
                    </div>
                    <div class="col-md-3">
                        <input type="password" th:field="*{passwordHash}" class="form-control" placeholder="Contraseña" required>
                    </div>
                    <div class="col-md-4">
                        <select th:field="*{cargo}" class="form-select">
                            <option value="VETERINARIO">Veterinario</option>
                            <option value="RECEPCION">Recepción</option>
                            <option value="ADMINISTRADOR">Administrador</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="Teléfono">
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100">Registrar Personal</button>
                    </div>
                </form>
            </div>

            <div class="row">
                <div class="col-md-4" th:each="persona : ${listaPersonal}">
                    <div class="card p-4 shadow border-0 mb-3 bg-white">
                        <h5 class="fw-bold" th:text="${persona.nombreCompleto}">Nombre</h5>
                        <p class="small text-primary mb-1" th:text="${persona.cargo}">Cargo</p>
                        <span class="badge bg-dark" th:text="${persona.codigoInstitucional}">Código</span>
                        <span class="badge bg-success" th:if="${persona.activo}">Activo</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
