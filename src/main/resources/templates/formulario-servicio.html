<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('servicios')}"></nav>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-4">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Datos del Servicio</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Servicio</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Precio (S/)</label>
                            <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-success px-4">Guardar</button>
                            <a th:href="@{/servicios}" class="btn btn-secondary px-4">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
