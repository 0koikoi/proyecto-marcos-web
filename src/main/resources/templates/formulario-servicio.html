<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<nav th:replace="~{layout :: navbar}"></nav>

<nav th:replace="~{layout :: sidebar('servicios')}"></nav>

<main>
    <div class="card shadow-sm border-0">
        <div class="card-header border-bottom">
            <h4 class="mb-0 fw-bold" th:text="${servicio.id == null} ? 'Registrar Nuevo Servicio' : 'Editar Servicio'">
                Datos del Servicio
            </h4>
        </div>
        <div class="card-body mt-2">
            <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Nombre del Servicio</label>
                    <select th:field="*{nombre}" class="form-select" required>
                        <option value="" disabled selected>Seleccione un servicio...</option>
                        <option value="Consulta General">Consulta General</option>
                        <option value="Vacunación">Vacunación</option>
                        <option value="Desparasitación">Desparasitación</option>
                        <option value="Baño y Corte">Baño y Corte</option>
                        <option value="Ecografía">Ecografía</option>
                        <option value="Cirugía">Cirugía</option>
                        <option value="Análisis Clínicos">Análisis Clínicos</option>
                        <option value="Profilaxis Dental">Profilaxis Dental</option>
                    </select>
                    <div class="text-muted small d-block mt-1">Elija uno de los servicios estándar de la clínica.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3" placeholder="Añada detalles o notas del servicio..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio (S/)</label>
                    <input type="number" step="0.01" min="0" th:field="*{precio}" class="form-control" required placeholder="0.00">
                </div>

                <div class="mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-success me-2">
                        <i class="fa-solid fa-save"></i> Guardar
                    </button>
                    <a th:href="@{/servicios}" class="btn btn-danger">
                        <i class="fa-solid fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
