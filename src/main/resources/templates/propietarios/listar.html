<html th:replace="~{layout :: page('Propietarios', 'propietarios', ~{::main}, ~{})}">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold">Gestión de Propietarios</h2>
        <a th:href="@{/propietarios/nuevo}" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Nuevo Propietario
        </a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">DNI</th>
                        <th>Nombre Completo</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Dirección</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="propietario : ${propietarios}">
                        <td class="ps-4 fw-bold" th:text="${propietario.dni}"></td>
                        <td th:text="${propietario.nombreCompleto}"></td>
                        <td th:text="${propietario.telefono}"></td>
                        <td th:text="${propietario.correo}"></td>
                        <td th:text="${propietario.direccion}"></td>
                        <td class="text-end pe-4">
                            <a th:href="@{/propietarios/editar/{id}(id=${propietario.id})}"
                               class="btn btn-sm btn-outline-warning rounded-pill px-3">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </a>
                            <!-- Eliminar: POST para proteger CSRF -->
                            <form th:action="@{/propietarios/eliminar/{id}(id=${propietario.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Seguro que desea eliminar este propietario? Se eliminarán sus pacientes asociados.')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3 ms-1">
                                    <i class="fa-solid fa-trash"></i> Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(propietarios)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="fa-solid fa-users-slash fa-2x mb-2 d-block text-secondary"></i>
                            No hay propietarios registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</html>
