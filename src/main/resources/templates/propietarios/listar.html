<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Propietarios - Huellitas</title>
</head>
<body class="bg-light">

<div th:replace="~{layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('propietarios')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h2 class="fw-bold">GESTIÓN DE PROPIETARIOS</h2>
                <a th:href="@{/propietarios/nuevo}" class="btn btn-primary">Nuevo propietario</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th class="border-0 rounded-start">ID</th>
                            <th>DNI</th>
                            <th>Nombre completo</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Dirección</th>
                            <th class="border-0 rounded-end text-end px-4">Acciones</th>
                        </tr>
                        </thead>
                        <tbody class="border-top-0">
                        <tr th:each="propietario : ${propietarios}">
                            <td th:text="${propietario.id}"></td>
                            <td th:text="${propietario.dni}"></td>
                            <td th:text="${propietario.nombreCompleto}"></td>
                            <td th:text="${propietario.telefono}"></td>
                            <td th:text="${propietario.correo}"></td>
                            <td th:text="${propietario.direccion}"></td>
                            <td class="text-end px-4">
                                <a th:href="@{/propietarios/editar/{id}(id=${propietario.id})}" class="btn btn-sm btn-outline-warning rounded-pill px-3 shadow-sm">
                                    <i class="fa-solid fa-pen-to-square"></i> Editar
                                </a>
                                <a th:href="@{/propietarios/eliminar/{id}(id=${propietario.id})}"
                                   class="btn btn-sm btn-outline-danger rounded-pill px-3 shadow-sm ms-2"
                                   onclick="return confirm('¿Seguro que desea eliminar este propietario?')">
                                    <i class="fa-solid fa-trash"></i> Eliminar
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(propietarios)}">
                            <td colspan="7" class="text-center text-muted py-5">
                                <i class="fa-solid fa-users-slash fs-1 mb-3 text-light"></i><br>
                                No hay propietarios registrados.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
