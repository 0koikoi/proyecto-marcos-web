<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Formulario propietario</title>
</head>
<body class="bg-light">

<div th:replace="~{layout :: header-mobile}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('propietarios')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <h2 class="fw-bold mb-4 border-bottom pb-3" th:text="${titulo}">Formulario propietario</h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card p-4 shadow-sm border-0">
                <form th:action="@{/propietarios/guardar}" th:object="${propietario}" method="post" class="row g-3">

                    <input type="hidden" th:field="*{id}">

                    <div class="col-md-4">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-id-card text-primary"></i> DNI <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{dni}" maxlength="8" class="form-control" th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid' : ''" placeholder="Ej. 12345678" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-user text-primary"></i> Nombre completo <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{nombreCompleto}" class="form-control" th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'is-invalid' : ''" placeholder="Ej. Juan Pérez" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-phone text-primary"></i> Teléfono <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{telefono}" maxlength="15" class="form-control" th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''" placeholder="+51 9XXXXXXXX" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-envelope text-primary"></i> Correo</label>
                        <input type="email" th:field="*{correo}" class="form-control" th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid' : ''" placeholder="ejemplo@gmail.com">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-location-dot text-primary"></i> Dirección</label>
                        <textarea th:field="*{direccion}" class="form-control" th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''" placeholder="Escribe la dirección aquí..." rows="3"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                    </div>

                    <div class="col-md-12 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/propietarios}" class="btn btn-secondary">Cancelar</a>
                    </div>

                </form>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
