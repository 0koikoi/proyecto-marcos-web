<html th:replace="~{layout :: page('Formulario Propietario', 'propietarios', ~{::main}, ~{})}">

<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <a th:href="@{/propietarios}" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0" th:text="${titulo}">Formulario Propietario</h2>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 p-4">
                <form th:action="@{/propietarios/guardar}" th:object="${propietario}" method="post" class="row g-3">
                    <input type="hidden" th:field="*{id}">

                    <div class="col-md-4">
                        <label class="form-label"><i class="fa-solid fa-id-card text-primary"></i> DNI <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{dni}" maxlength="8" pattern="\d{8}" inputmode="numeric"
                               title="El DNI debe tener exactamente 8 dígitos"
                               class="form-control" th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid' : ''"
                               placeholder="Ej. 12345678" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label"><i class="fa-solid fa-user text-primary"></i> Nombre Completo <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{nombreCompleto}" class="form-control"
                               th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'is-invalid' : ''"
                               placeholder="Ej. Juan Pérez" minlength="3" maxlength="100" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label"><i class="fa-solid fa-phone text-primary"></i> Teléfono <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{telefono}" maxlength="15"
                               pattern="(\+51\s?)?9\d{8}"
                               title="Formato válido: 912345678 o +51 912345678"
                               class="form-control" th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''"
                               placeholder="+51 9XXXXXXXX" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label"><i class="fa-solid fa-envelope text-primary"></i> Correo</label>
                        <input type="email" th:field="*{correo}" class="form-control"
                               th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid' : ''"
                               placeholder="ejemplo@gmail.com" maxlength="150">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label"><i class="fa-solid fa-location-dot text-primary"></i> Dirección <span class="text-danger">*</span></label>
                        <textarea th:field="*{direccion}" class="form-control"
                                  th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''"
                                  placeholder="Escribe la dirección aquí..." rows="3" maxlength="255" required></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                    </div>

                    <div class="col-md-12 d-flex gap-2 mt-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save me-1"></i> Guardar
                        </button>
                        <a th:href="@{/propietarios}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

</html>
