<html th:replace="~{layout :: page('Formulario Propietario', 'propietarios', ~{::main}, ~{})}">
<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <a th:href="@{/propietarios}" class="btn btn-sm btn-outline-secondary btn-icon">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0" th:text="${titulo}">Formulario Propietario</h2>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 p-4">
                <form th:action="@{/propietarios/guardar}" th:object="${propietario}" method="post" class="row g-3">
                    <input type="hidden" th:field="*{id}">

                    <div class="col-md-4">
                        <label class="form-label">
                            <i class="fa-solid fa-id-card text-primary me-1"></i> DNI <span class="text-danger">*</span>
                        </label>
                        <input type="text" th:field="*{dni}" maxlength="8" pattern="\d{8}" inputmode="numeric" 
                               title="El DNI debe tener exactamente 8 dígitos" class="form-control"
                               th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid' : ''"
                               placeholder="Ej. 12345678" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            <i class="fa-solid fa-user text-primary me-1"></i> Nombres <span class="text-danger">*</span>
                        </label>
                        <input type="text" th:field="*{nombres}" class="form-control" id="nombres"
                               th:classappend="${#fields.hasErrors('nombres')} ? 'is-invalid' : ''"
                               placeholder="Ej. Juan" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            <i class="fa-solid fa-user text-primary me-1"></i> Apellidos <span class="text-danger">*</span>
                        </label>
                        <input type="text" th:field="*{apellidos}" class="form-control"
                               th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid' : ''"
                               placeholder="Ej. Pérez" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            <i class="fa-solid fa-phone text-primary me-1"></i> Teléfono <span class="text-danger">*</span>
                        </label>
                        <input type="text" th:field="*{telefono}" maxlength="9" placeholder="912345678"
                               pattern="9\d{8}" title="Formato válido: 912345678" class="form-control"
                               th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label">
                            <i class="fa-solid fa-envelope text-primary me-1"></i> Correo
                        </label>
                        <input type="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="ejemplo@gmail.com">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">
                            <i class="fa-solid fa-location-dot text-primary me-1"></i> Dirección <span class="text-danger">*</span>
                        </label>
                        <textarea th:field="*{direccion}" class="form-control"
                                  th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''"
                                  placeholder="Escribe la dirección aquí..." rows="3" required></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                    </div>

                    <div class="col-12 mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                        <a th:href="@{/propietarios}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fa-solid fa-save me-1"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = this;
            const id = document.getElementById('id').value;
            const dni = document.getElementById('dni').value;
            const nombres = document.getElementById('nombres').value;
            const telefono = document.getElementById('telefono').value;
            
            if (!dni || !nombres || !telefono) {
                form.submit();
                return;
            }
            
            try {
                if (!id) {
                    const resDni = await fetch(`/propietarios/api/validar-dni?dni=${encodeURIComponent(dni)}`);
                    const existeDni = await resDni.json();
                    if (existeDni) {
                        alert('Error: Ya existe un propietario registrado con este DNI.');
                        return;
                    }
                }
                
                const resSim = await fetch(`/propietarios/api/validar-similar?nombres=${encodeURIComponent(nombres)}&telefono=${encodeURIComponent(telefono)}`);
                const existeSim = await resSim.json();
                
                if (existeSim) {
                    if (confirm('Advertencia: Existe un propietario con nombres o teléfono similares. ¿Desea continuar?')) {
                        form.submit();
                    }
                } else {
                    form.submit();
                }
            } catch (err) {
                form.submit();
            }
        });
    </script>
</main>
</html>
