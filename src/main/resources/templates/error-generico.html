<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Error del Sistema - Huellitas')}">
    <title>Error - Huellitas</title>
</head>
<body class="bg-light">

<div th:replace="~{layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('dashboard')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
                <div class="card border-0 shadow-sm" style="max-width: 500px; width: 100%; border-top: 4px solid var(--danger) !important; border-radius: 12px;">
                    <div class="card-body p-5 text-center">
                        <div class="mb-4">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size: 3.5rem; color: var(--danger);"></i>
                        </div>
                        <h4 class="fw-bold mb-3" style="color: var(--text-main);">Operación Detenida</h4>

                        <p class="text-muted mb-4" th:text="${errorGlobal}">Ocurrió un error inesperado en el sistema.</p>

                        <button onclick="history.back()" class="btn btn-danger px-4 py-2 fw-medium w-100">
                            <i class="fa-solid fa-arrow-left me-2"></i>Volver e intentar de nuevo
                            <!--Instruye al navegador para regresar exactamente a la pantalla anterior
                                conservando los datos del formulario, permitiéndole corregir solo el
                                campo que causó el error. Eso es pensar en la experiencia del usuario
                                y en el estrés del cliente. Esto era repaso en el wpp help-->
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
