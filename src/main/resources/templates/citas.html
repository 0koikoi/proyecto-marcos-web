<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Citas - Huellitas</title>
</head>
<body class="bg-light">

<div th:replace="~{layout :: navbar}"></div>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('citas')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h2 class="fw-bold m-0">GESTIÓN DE CITAS</h2>
                <a th:href="@{/citas/nuevo}" class="btn btn-primary">
                    <i class="fa-solid fa-plus me-1"></i> Nueva Cita
                </a>
            </div>

            <!-- Resumen de estados -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm text-center p-3">
                        <div class="fs-4 fw-bold text-warning" th:text="${citas.?[estado == 'PENDIENTE'].size()}">0</div>
                        <div class="small text-muted">Pendientes</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm text-center p-3">
                        <div class="fs-4 fw-bold text-primary" th:text="${citas.?[estado == 'EN_PROCESO'].size()}">0</div>
                        <div class="small text-muted">En Proceso</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm text-center p-3">
                        <div class="fs-4 fw-bold text-success" th:text="${citas.?[estado == 'COMPLETADA'].size()}">0</div>
                        <div class="small text-muted">Completadas</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm text-center p-3">
                        <div class="fs-4 fw-bold text-danger" th:text="${citas.?[estado == 'CANCELADA'].size()}">0</div>
                        <div class="small text-muted">Canceladas</div>
                    </div>
                </div>
            </div>

            <!-- Tabla de citas -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">#</th>
                                <th>Paciente</th>
                                <th>Dueño</th>
                                <th>Veterinario</th>
                                <th>Fecha y Hora</th>
                                <th>Motivo</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${citas.empty}">
                                <td colspan="8" class="text-center text-muted py-5">
                                    <i class="fa-solid fa-calendar-xmark fa-2x mb-2 d-block"></i>
                                    No hay citas registradas. <a th:href="@{/citas/nuevo}">Crea la primera aquí</a>.
                                </td>
                            </tr>
                            <tr th:each="cita, iterStat : ${citas}">
                                <td class="ps-4 text-muted" th:text="${iterStat.count}"></td>
                                <td>
                                    <div class="fw-semibold" th:text="${cita.paciente.nombre}"></div>
                                    <small class="text-muted" th:text="${cita.paciente.especie}"></small>
                                </td>
                                <td th:text="${cita.paciente.propietario.nombreCompleto}"></td>
                                <td>
                                    <div th:text="${cita.personal.nombreCompleto}"></div>
                                    <small class="text-muted" th:text="${cita.personal.cargo}"></small>
                                </td>
                                <td>
                                    <div th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy')}"></div>
                                    <small class="text-muted" th:text="${#temporals.format(cita.fechaHora, 'HH:mm')} + ' hrs'"></small>
                                </td>
                                <td>
                                    <span th:text="${#strings.abbreviate(cita.motivo, 40)}" th:title="${cita.motivo}"></span>
                                </td>
                                <td>
                                    <span th:text="${cita.estado}"
                                          th:class="${cita.estado == 'PENDIENTE'} ? 'badge bg-warning text-dark'
                                                   : (${cita.estado == 'EN_PROCESO'} ? 'badge bg-primary'
                                                   : (${cita.estado == 'COMPLETADA'} ? 'badge bg-success'
                                                   : 'badge bg-danger'))">
                                    </span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/citas/editar/{id}(id=${cita.id})}"
                                           class="btn btn-outline-primary" title="Editar">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </a>
                                        <a th:href="@{/citas/cancelar/{id}(id=${cita.id})}"
                                           th:if="${cita.estado != 'CANCELADA' && cita.estado != 'COMPLETADA'}"
                                           class="btn btn-outline-warning" title="Cancelar"
                                           onclick="return confirm('¿Cancelar esta cita?')">
                                            <i class="fa-solid fa-ban"></i>
                                        </a>
                                        <a th:href="@{/citas/eliminar/{id}(id=${cita.id})}"
                                           class="btn btn-outline-danger" title="Eliminar"
                                           onclick="return confirm('¿Eliminar esta cita permanentemente?')">
                                            <i class="fa-solid fa-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
