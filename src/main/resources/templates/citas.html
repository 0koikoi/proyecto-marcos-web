<html th:replace="~{layout :: page('Citas', 'citas', ~{::main}, ~{})}">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold m-0">Gestión de Citas</h2>
        <a th:href="@{/citas/nuevo}" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Nueva Cita
        </a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Resumen de estados -->
    <section class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <div class="fs-4 fw-bold text-warning" th:text="${citas.?[estado.name() == 'PENDIENTE'].size()}">0</div>
                <div class="small text-muted">Pendientes</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <div class="fs-4 fw-bold text-primary" th:text="${citas.?[estado.name() == 'EN_PROCESO'].size()}">0</div>
                <div class="small text-muted">En Proceso</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <div class="fs-4 fw-bold text-success" th:text="${citas.?[estado.name() == 'COMPLETADA'].size()}">0</div>
                <div class="small text-muted">Completadas</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <div class="fs-4 fw-bold text-danger" th:text="${citas.?[estado.name() == 'CANCELADA'].size()}">0</div>
                <div class="small text-muted">Canceladas</div>
            </div>
        </div>
    </section>

    <!-- Tabla de citas -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">#</th>
                        <th>Paciente</th>
                        <th>Dueño</th>
                        <th>Veterinario</th>
                        <th>Fecha y Hora</th>
                        <th>Motivo</th>
                        <th>Estado</th>
                        <th class="text-center pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${citas.empty}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="fa-solid fa-calendar-xmark fa-2x mb-2 d-block"></i>
                            No hay citas registradas. <a th:href="@{/citas/nuevo}">Crea la primera aquí</a>.
                        </td>
                    </tr>
                    <tr th:each="cita, iterStat : ${citas}">
                        <td class="ps-4 text-muted" th:text="${iterStat.count}"></td>
                        <td>
                            <div class="fw-semibold" th:text="${cita.paciente.nombre}"></div>
                            <small class="text-muted" th:text="${cita.paciente.especie}"></small>
                        </td>
                        <td th:text="${cita.paciente.propietario.nombreCompleto}"></td>
                        <td>
                            <div th:text="${cita.personal.nombreCompleto}"></div>
                            <small class="text-muted" th:text="${cita.personal.cargo}"></small>
                        </td>
                        <td>
                            <div th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy')}"></div>
                            <small class="text-muted" th:text="${#temporals.format(cita.fechaHora, 'HH:mm')} + ' hrs'"></small>
                        </td>
                        <td>
                            <span th:text="${#strings.abbreviate(cita.motivo, 40)}" th:title="${cita.motivo}"></span>
                        </td>
                        <td>
                            <span th:text="${cita.estado}"
                                  th:class="${cita.estado.name() == 'PENDIENTE'}   ? 'badge bg-warning text-dark'
                                           : (${cita.estado.name() == 'EN_PROCESO'} ? 'badge bg-primary'
                                           : (${cita.estado.name() == 'COMPLETADA'} ? 'badge bg-success'
                                           : 'badge bg-danger'))">
                            </span>
                        </td>
                        <td class="text-center pe-4">
                            <div class="btn-group btn-group-sm">
                                <!-- Editar es solo lectura (GET seguro) -->
                                <a th:href="@{/citas/editar/{id}(id=${cita.id})}"
                                   class="btn btn-outline-primary" title="Editar">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </a>
                                <!-- Cancelar: POST para proteger CSRF -->
                                <form th:if="${cita.estado.name() != 'CANCELADA' and cita.estado.name() != 'COMPLETADA'}"
                                      th:action="@{/citas/cancelar/{id}(id=${cita.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('¿Cancelar esta cita?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-outline-warning" title="Cancelar">
                                        <i class="fa-solid fa-ban"></i>
                                    </button>
                                </form>
                                <!-- Eliminar: POST para proteger CSRF -->
                                <form th:action="@{/citas/eliminar/{id}(id=${cita.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('¿Eliminar esta cita permanentemente?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-outline-danger" title="Eliminar">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</html>
