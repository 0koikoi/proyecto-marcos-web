<html th:replace="~{layout :: page('Formulario Paciente', 'pacientes', ~{::main}, ~{})}">

<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <a th:href="@{/pacientes}" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0" th:text="${titulo}">Formulario Paciente</h2>
    </div>
    <html th:replace="~{layout :: page('Formulario Paciente', 'pacientes', ~{::main}, ~{})}">

    <main>
        <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
            <a th:href="@{/pacientes}" class="btn btn-sm btn-outline-secondary">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="fw-bold m-0" th:text="${titulo}">Formulario Paciente</h2>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 p-4">
                    <div class="row justify-content-center">
                        <div class="col-lg-8">
                            <div class="card shadow-sm border-0 p-4">
                                <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post"
                                    class="row g-3">
                                    <input type="hidden" th:field="*{id}">

                                    <div class="col-md-6">
                                        <label class="form-label">
                                            <i class="fa-solid fa-dog text-primary"></i> Nombre del paciente <span
                                                class="text-danger">*</span>
                                        </label>
                                        <input type="text" th:field="*{nombre}" class="form-control"
                                            th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                            placeholder="Nombre de la mascota" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                                            th:errors="*{nombre}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">
                                            <i class="fa-solid fa-paw text-primary"></i> Especie <span
                                                class="text-danger">*</span>
                                        </label>
                                        <select th:field="*{especie}" class="form-select"
                                            th:classappend="${#fields.hasErrors('especie')} ? 'is-invalid' : ''">
                                            <label class="form-label">
                                                <i class="fa-solid fa-paw text-primary"></i> Especie <span
                                                    class="text-danger">*</span>
                                            </label>
                                            <select th:field="*{especie}" class="form-select"
                                                th:classappend="${#fields.hasErrors('especie')} ? 'is-invalid' : ''">
                                                <option value="">Seleccione una especie</option>
                                                <option value="Perro">Perro</option>
                                                <option value="Gato">Gato</option>
                                                <option value="Hamster">Hamster</option>
                                                <option value="Ave">Ave</option>
                                                <option value="Conejo">Conejo</option>
                                                <option value="Reptil">Reptil</option>
                                                <option value="Otro">Otro</option>
                                            </select>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('especie')}"
                                                th:errors="*{especie}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Raza</label>
                                        <input type="text" th:field="*{raza}" class="form-control"
                                            th:classappend="${#fields.hasErrors('raza')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('raza')}"
                                            th:errors="*{raza}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Fecha de Nacimiento</label>
                                        <input type="date" th:field="*{fechaNacimiento}" class="form-control"
                                            th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid' : ''">
                                        <label class="form-label">Fecha de Nacimiento</label>
                                        <input type="date" th:field="*{fechaNacimiento}" class="form-control"
                                            th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}"
                                            th:errors="*{fechaNacimiento}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">
                                            <i class="fa-solid fa-venus-mars text-primary"></i> Género
                                        </label>
                                        <select th:field="*{genero}" class="form-select"
                                            th:classappend="${#fields.hasErrors('genero')} ? 'is-invalid' : ''">
                                            <label class="form-label">
                                                <i class="fa-solid fa-venus-mars text-primary"></i> Género
                                            </label>
                                            <select th:field="*{genero}" class="form-select"
                                                th:classappend="${#fields.hasErrors('genero')} ? 'is-invalid' : ''">
                                                <option value="">Seleccione</option>
                                                <option value="MACHO">Macho</option>
                                                <option value="HEMBRA">Hembra</option>
                                                <option value="DESCONOCIDO">Desconocido</option>
                                                <option value="MACHO">Macho</option>
                                                <option value="HEMBRA">Hembra</option>
                                                <option value="DESCONOCIDO">Desconocido</option>
                                            </select>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('genero')}"
                                                th:errors="*{genero}"></div>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('genero')}"
                                                th:errors="*{genero}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">
                                            <i class="fa-solid fa-user-tie text-primary"></i> Propietario <span
                                                class="text-danger">*</span>
                                        </label>
                                        <select th:field="*{propietarioId}" class="form-select"
                                            th:classappend="${#fields.hasErrors('propietarioId')} ? 'is-invalid' : ''"
                                            required>
                                            <label class="form-label">
                                                <i class="fa-solid fa-user-tie text-primary"></i> Propietario <span
                                                    class="text-danger">*</span>
                                            </label>
                                            <select th:field="*{propietarioId}" class="form-select"
                                                th:classappend="${#fields.hasErrors('propietarioId')} ? 'is-invalid' : ''"
                                                required>
                                                <option value="">Seleccione un propietario</option>
                                                <option th:each="propietario : ${propietarios}"
                                                    th:value="${propietario.id}"
                                                    th:text="${propietario.nombreCompleto + ' - DNI: ' + propietario.dni}">
                                                </option>
                                            </select>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('propietarioId')}"
                                                th:errors="*{propietarioId}"></div>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('propietarioId')}"
                                                th:errors="*{propietarioId}"></div>
                                    </div>

                                    <div class="col-md-12 d-flex gap-2 mt-2">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fa-solid fa-save me-1"></i> Guardar
                                        </button>
                                        <a th:href="@{/pacientes}" class="btn btn-outline-secondary">Cancelar</a>
                                        <div class="col-md-12 d-flex gap-2 mt-2">
                                            <button type="submit" class="btn btn-primary">
                                                <i class="fa-solid fa-save me-1"></i> Guardar
                                            </button>
                                            <a th:href="@{/pacientes}" class="btn btn-outline-secondary">Cancelar</a>
                                        </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
    </main>
</main>

</html>
