<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Formulario paciente</title>
</head>
<body class="bg-light">

<div th:replace="~{layout :: header-mobile}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('pacientes')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <h2 class="fw-bold mb-4 border-bottom pb-3" th:text="${titulo}">Formulario paciente</h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card p-4 shadow-sm border-0">
                <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post" class="row g-3">

                    <input type="hidden" th:field="*{id}">

                    <div class="col-md-6">
                        <label class="form-label">Nombre del paciente</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Especie</label>
                        <input type="text" th:field="*{especie}" class="form-control" placeholder="Ejemplo: Perro, Gato" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Raza</label>
                        <input type="text" th:field="*{raza}" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date" th:field="*{fechaNacimiento}" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Género</label>
                        <select th:field="*{genero}" class="form-select">
                            <option value="">Seleccione</option>
                            <option value="Macho">Macho</option>
                            <option value="Hembra">Hembra</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Propietario</label>

                        <select th:field="*{propietario.id}" class="form-select" required>
                            <option value="">Seleccione un propietario</option>

                            <option th:each="propietario : ${propietarios}"
                                    th:value="${propietario.id}"
                                    th:text="${propietario.nombreCompleto + ' - DNI: ' + propietario.dni}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-12 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/pacientes}" class="btn btn-secondary">Cancelar</a>
                    </div>

                </form>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
