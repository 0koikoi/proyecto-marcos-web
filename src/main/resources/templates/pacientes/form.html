<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Formulario paciente</title>
</head>
<body class="bg-light">

<div th:replace="~{layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('pacientes')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <h2 class="fw-bold mb-4 border-bottom pb-3" th:text="${titulo}">Formulario paciente</h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card p-4 shadow-sm border-0">
                <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post" class="row g-3">

                    <input type="hidden" th:field="*{id}">

                    <div class="col-md-6">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-dog text-primary"></i> Nombre del paciente <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{nombre}" class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" placeholder="Nombre de la mascota" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-paw text-primary"></i> Especie <span class="text-danger">*</span></label>
                        <select th:field="*{especie}" class="form-select" th:classappend="${#fields.hasErrors('especie')} ? 'is-invalid' : ''">
                            <option value="">Seleccione una especie</option>
                            <option value="Perro">Perro</option>
                            <option value="Gato">Gato</option>
                            <option value="Hamster">Hamster</option>
                            <option value="Ave">Ave</option>
                            <option value="Conejo">Conejo</option>
                            <option value="Reptil">Reptil</option>
                            <option value="Otro">Otro</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Raza</label>
                        <input type="text" th:field="*{raza}" class="form-control" th:classappend="${#fields.hasErrors('raza')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('raza')}" th:errors="*{raza}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date" th:field="*{fechaNacimiento}" class="form-control" th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-venus-mars text-primary"></i> Género</label>
                        <select th:field="*{genero}" class="form-select">
                            <option value="">Seleccione</option>
                            <option value="Macho">Macho</option>
                            <option value="Hembra">Hembra</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-user-tie text-primary"></i> Propietario <span class="text-danger">*</span></label>

                        <select th:field="*{propietarioId}" class="form-select" th:classappend="${#fields.hasErrors('propietarioId')} ? 'is-invalid' : ''" required>
                            <option value="">Seleccione un propietario</option>
                            <option th:each="propietario : ${propietarios}"
                                    th:value="${propietario.id}"
                                    th:text="${propietario.nombreCompleto + ' - DNI: ' + propietario.dni}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('propietarioId')}" th:errors="*{propietarioId}"></div>
                    </div>

                    <div class="col-md-12 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/pacientes}" class="btn btn-secondary">Cancelar</a>
                    </div>

                </form>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
