<html th:replace="~{layout :: page('Formulario Paciente', 'pacientes', ~{::main}, ~{::#custom-scripts})}">
<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <a th:href="@{/pacientes}" class="btn btn-sm btn-outline-secondary btn-icon">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0" th:text="${titulo}">Formulario Paciente</h2>
    </div>

    <div th:replace="~{layout :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 p-4">
                <form id="pacienteForm" th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post" class="row g-3">
                    <input type="hidden" th:field="*{id}">

                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="fa-solid fa-dog text-primary me-1"></i> Nombre <span class="text-danger">*</span>
                        </label>
                        <input type="text" th:field="*{nombre}" class="form-control"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                               placeholder="Nombre de la mascota" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="fa-solid fa-paw text-primary me-1"></i> Especie <span class="text-danger">*</span>
                        </label>
                        <select th:field="*{especie}" class="form-select"
                                th:classappend="${#fields.hasErrors('especie')} ? 'is-invalid' : ''" required>
                            <option value="" disabled selected>Seleccione una especie...</option>
                            <option value="Perro">Perro</option>
                            <option value="Gato">Gato</option>
                            <option value="Hamster">Hamster</option>
                            <option value="Ave">Ave</option>
                            <option value="Conejo">Conejo</option>
                            <option value="Reptil">Reptil</option>
                            <option value="Otro">Otro</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="fa-solid fa-tag text-primary me-1"></i> Raza
                        </label>
                        <input type="text" th:field="*{raza}" class="form-control"
                               th:classappend="${#fields.hasErrors('raza')} ? 'is-invalid' : ''"
                               placeholder="Raza (Opcional)">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('raza')}" th:errors="*{raza}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            <i class="fa-solid fa-calendar text-primary me-1"></i> Fecha de Nacimiento <span class="text-danger">*</span>
                        </label>
                        <input type="date" th:field="*{fechaNacimiento}" class="form-control" id="fechaNacimiento"
                               th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
                        <small id="edadMascota" class="text-muted mt-1 d-block fw-semibold"></small>
                    </div>
                    
                    <div class="col-md-2 d-flex align-items-center mt-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{fechaNacimientoEstimada}" id="fechaNacimientoEstimada">
                            <label class="form-check-label" for="fechaNacimientoEstimada">
                                Es estimada
                            </label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="fa-solid fa-venus-mars text-primary me-1"></i> Género
                        </label>
                        <select th:field="*{genero}" class="form-select"
                                th:classappend="${#fields.hasErrors('genero')} ? 'is-invalid' : ''">
                            <option value="" disabled selected>Seleccione...</option>
                            <option value="MACHO">Macho</option>
                            <option value="HEMBRA">Hembra</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="fa-solid fa-user-tie text-primary me-1"></i> Propietario <span class="text-danger">*</span>
                        </label>
                        <select th:field="*{propietarioId}" class="form-select"
                                th:classappend="${#fields.hasErrors('propietarioId')} ? 'is-invalid' : ''" required>
                            <option value="" disabled selected>Seleccione un propietario...</option>
                            <option th:each="prop : ${propietarios}"
                                    th:value="${prop.id}"
                                    th:text="${prop.nombreCompleto + ' (DNI: ' + prop.dni + ')'}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('propietarioId')}" th:errors="*{propietarioId}"></div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="fa-solid fa-notes-medical text-primary me-1"></i> Alergias
                        </label>
                        <textarea th:field="*{alergias}" class="form-control" rows="2" placeholder="Especifique alergias si las hay"></textarea>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            <i class="fa-solid fa-heart-pulse text-primary me-1"></i> Estado
                        </label>
                        <select th:field="*{estado}" class="form-select">
                            <option value="ACTIVO">Activo</option>
                            <option value="INACTIVO">Inactivo</option>
                            <option value="FALLECIDO">Fallecido</option>
                        </select>
                    </div>

                    <div class="col-md-2 d-flex align-items-center mt-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{esterilizado}" id="esterilizado">
                            <label class="form-check-label" for="esterilizado">
                                Esterilizado
                            </label>
                        </div>
                    </div>

                    <div class="col-12 mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                        <a th:href="@{/pacientes}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fa-solid fa-save me-1"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<div id="custom-scripts">
    <script>
        function calcularEdad(fechaNacimiento) {
            if (!fechaNacimiento) return '';
            
            const hoy = new Date();
            const nac = new Date(fechaNacimiento);
            
            // Usamos UTC para evitar desfasajes horarios
            const utcHoy = new Date(Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()));
            const utcNac = new Date(Date.UTC(nac.getFullYear(), nac.getMonth(), nac.getDate()));
            
            if (utcNac > utcHoy) return 'Edad: Fecha inválida (en el futuro)';
            
            let years = utcHoy.getUTCFullYear() - utcNac.getUTCFullYear();
            let months = utcHoy.getUTCMonth() - utcNac.getUTCMonth();
            let days = utcHoy.getUTCDate() - utcNac.getUTCDate();
            
            if (days < 0) {
                months--;
                // Obtener días del mes anterior
                const ultimoDiaMesAnterior = new Date(Date.UTC(utcHoy.getUTCFullYear(), utcHoy.getUTCMonth(), 0)).getUTCDate();
                days += ultimoDiaMesAnterior;
            }
            if (months < 0) {
                years--;
                months += 12;
            }
            
            let texto = 'Edad aproximada: ';
            if (years > 0) {
                texto += years + (years === 1 ? ' año' : ' años');
                if (months > 0) texto += ', ' + months + (months === 1 ? ' mes' : ' meses');
            } else if (months > 0) {
                texto += months + (months === 1 ? ' mes' : ' meses');
                if (days > 0) texto += ' y ' + days + (days === 1 ? ' día' : ' días');
            } else {
                texto += days + (days === 1 ? ' día' : ' días') + ' de nacido';
            }
            
            return texto;
        }

        const inputFecha = document.getElementById('fechaNacimiento');
        const spanEdad = document.getElementById('edadMascota');
        
        if (inputFecha) {
            inputFecha.addEventListener('change', function() {
                spanEdad.textContent = calcularEdad(this.value);
            });
            // Calcular al cargar
            if (inputFecha.value) {
                spanEdad.textContent = calcularEdad(inputFecha.value);
            }
        }

        document.getElementById('pacienteForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = this;
            const id = document.getElementById('id').value;
            if (id) {
                // Skip if editing
                form.submit();
                return;
            }
            const nombre = document.getElementById('nombre').value;
            const especie = document.getElementById('especie').value;
            const propietarioId = document.getElementById('propietarioId').value;
            
            if (!nombre || !especie || !propietarioId) {
                form.submit();
                return;
            }
            
            try {
                const res = await fetch(`/pacientes/api/validar-similar?propietarioId=${propietarioId}&nombre=${encodeURIComponent(nombre)}&especie=${encodeURIComponent(especie)}`);
                const existe = await res.json();
                
                if (existe) {
                    if (confirm('Advertencia: El propietario ya tiene una mascota registrada con el mismo nombre y especie. ¿Desea continuar?')) {
                        form.submit();
                    }
                } else {
                    form.submit();
                }
            } catch (err) {
                form.submit();
            }
        });
    </script>
</div>
</html>
