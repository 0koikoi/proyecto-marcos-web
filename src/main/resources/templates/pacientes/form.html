<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Formulario Paciente - Huellitas</title>
</head>
<body>

<div th:replace="~{layout :: navbar}"></div>
<nav th:replace="~{layout :: sidebar('pacientes')}"></nav>

<main>
    <div class="card shadow-sm border-0 p-4 bg-white">
        <h2 class="fw-bold mb-4 border-bottom pb-3" th:text="${titulo}">Formulario paciente</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}">

            <div class="col-md-6">
                <label class="form-label fw-semibold">Nombre del paciente <span class="text-danger">*</span></label>
                <input type="text" th:field="*{nombre}" class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" placeholder="Nombre de la mascota" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold">Especie <span class="text-danger">*</span></label>
                <select th:field="*{especie}" class="form-select" th:classappend="${#fields.hasErrors('especie')} ? 'is-invalid' : ''" required>
                    <option value="">Seleccione una especie</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                    <option value="Hamster">Hamster</option>
                    <option value="Ave">Ave</option>
                    <option value="Conejo">Conejo</option>
                    <option value="Reptil">Reptil</option>
                    <option value="Otro">Otro</option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label">Raza</label>
                <input type="text" th:field="*{raza}" class="form-control" th:classappend="${#fields.hasErrors('raza')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('raza')}" th:errors="*{raza}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" th:field="*{fechaNacimiento}" class="form-control" th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold">Género</label>
                <select th:field="*{genero}" class="form-select">
                    <option value="">Seleccione</option>
                    <option value="Macho">Macho</option>
                    <option value="Hembra">Hembra</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold">Propietario <span class="text-danger">*</span></label>
                <select th:field="*{propietario.id}" class="form-select" th:classappend="${#fields.hasErrors('propietario')} ? 'is-invalid' : ''" required>
                    <option value="">Seleccione un propietario...</option>
                    <option th:each="propietario : ${propietarios}"
                            th:value="${propietario.id}"
                            th:text="${propietario.nombreCompleto + ' - DNI: ' + propietario.dni}">
                    </option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('propietario')}" th:errors="*{propietario}"></div>
                <div class="text-muted small mt-1">Obligatorio: El paciente no puede registrarse sin dueño.</div>
            </div>

            <div class="col-md-12 mt-4 pt-3 border-top text-end">
                <a th:href="@{/pacientes}" class="btn btn-danger me-2">Cancelar</a>
                <button type="submit" class="btn btn-success px-4">Guardar</button>
            </div>

        </form>
    </div>
</main>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
