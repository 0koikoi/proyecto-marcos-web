<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Pacientes - Huellitas</title>
</head>
<body>

<div th:replace="~{layout :: navbar}"></div>
<nav th:replace="~{layout :: sidebar('pacientes')}"></nav>

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold">Gestión de Pacientes</h2>

        <form method="GET" th:action="@{/pacientes}" class="d-flex">
            <input type="text" name="buscar" th:value="${buscar}" class="form-control me-2" placeholder="Buscar por nombre...">
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:if="${buscar != null and !buscar.isEmpty()}" th:href="@{/pacientes}" class="btn btn-secondary ms-2">Limpiar</a>
        </form>

        <a th:href="@{/pacientes/nuevo}" class="btn btn-success">Nuevo paciente</a>
    </div>

    <div class="card shadow-sm border-0 bg-white p-3">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Especie</th>
                    <th>Raza</th>
                    <th>Fecha de Nacimiento</th>
                    <th>Género</th>
                    <th>Propietario</th>
                    <th class="text-end px-4">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="paciente : ${pacientes}">
                    <td th:text="${paciente.id}"></td>
                    <td class="fw-bold text-capitalize" th:text="${paciente.nombre}"></td>
                    <td th:text="${paciente.especie}"></td>
                    <td th:text="${paciente.raza}"></td>
                    <td th:text="${paciente.fechaNacimiento}"></td>
                    <td th:text="${paciente.genero}"></td>
                    <td th:text="${paciente.propietario.nombreCompleto}"></td>

                    <td class="text-end px-4">
                        <a th:href="@{/pacientes/editar/{id}(id=${paciente.id})}" class="btn btn-sm btn-warning">
                            Editar
                        </a>
                        <a th:href="@{/pacientes/eliminar/{id}(id=${paciente.id})}"
                           class="btn btn-sm btn-danger ms-2"
                           onclick="return confirm('¿Seguro que desea eliminar este paciente?')">
                            Eliminar
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(pacientes)}">
                    <td colspan="8" class="text-center text-muted py-5">
                        No hay pacientes registrados con ese criterio.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
