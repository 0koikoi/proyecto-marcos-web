<!DOCTYPE html>
<!-- se cambian los títulos así como estoy a 2 tics de cambiar de carrera -->
<html th:replace="~{layout :: page('Gestión de Pacientes', 'pacientes', ~{::main}, ~{})}">

<!-- SOLO EXISTE EL MAIN -->
<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="fw-bold">Gestión de Pacientes</h2>

        <form method="GET" th:action="@{/pacientes}" class="d-flex">
            <input type="text" name="buscar" th:value="${buscar}" class="form-control me-2"
                placeholder="Buscar por nombre...">
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:if="${buscar != null and !buscar.isEmpty()}" th:href="@{/pacientes}"
                class="btn btn-secondary ms-2">Limpiar</a>
        </form>

        <a th:href="@{/pacientes/nuevo}" class="btn btn-primary">Nuevo paciente</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="border-0 rounded-start px-4">ID</th>
                            <th>Nombre</th>
                            <th>Especie</th>
                            <th>Raza</th>
                            <th>Fecha nacimiento</th>
                            <th>Género</th>
                            <th>Propietario</th>
                            <th class="border-0 rounded-end text-end px-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:each="paciente : ${pacientes}">
                            <td class="px-4" th:text="${paciente.id}"></td>
                            <td th:text="${paciente.nombre}"></td>
                            <td th:text="${paciente.especie}"></td>
                            <td th:text="${paciente.raza}"></td>
                            <td th:text="${paciente.fechaNacimiento}"></td>
                            <td th:text="${paciente.genero}"></td>
                            <td th:text="${paciente.propietarioNombreCompleto}"></td>
                            <td class="text-end px-4">
                                <a th:href="@{/pacientes/editar/{id}(id=${paciente.id})}"
                                    class="btn btn-outline-warning btn-icon" title="Editar">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </a>

                                <!-- CORRECCIÓN DE SEGURIDAD CSRF: Eliminar debe ser POST -->
                                <form th:action="@{/pacientes/eliminar/{id}(id=${paciente.id})}" method="post"
                                    class="d-inline"
                                    onsubmit="return confirm('¿Seguro que desea eliminar este paciente?');">
                                    <button type="submit"
                                        class="btn btn-outline-danger btn-icon ms-1" title="Eliminar">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(pacientes)}">
                            <td colspan="8" class="text-center text-muted py-5">
                                <i class="fa-solid fa-folder-open fs-1 mb-3 text-light"></i><br>
                                No hay pacientes registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</html>
