<html th:replace="~{layout :: page('Nueva Consulta', 'historia', ~{::main}, ~{})}"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <a th:href="@{/historia}" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0">
            <i class="fa-solid fa-file-medical me-2"></i> Nueva Consulta Veterinaria
        </h2>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 p-4">
                <form th:action="@{/historia/guardar}" th:object="${historia}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" th:field="*{id}">

                    <!-- Paciente -->
                    <div class="mb-3">
                        <label class="form-label">Paciente</label>
                        <select name="paciente" class="form-select" required>
                            <option value="">-- Seleccione un paciente --</option>
                            <option th:each="p : ${pacientes}" th:value="${p.id}"
                                    th:text="${p.nombre} + ' (' + ${p.especie} + ')'"
                                    th:selected="${historia.paciente != null and historia.paciente.id == p.id}">
                            </option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('paciente')}" th:errors="*{paciente}"></div>
                    </div>

                    <!-- Veterinario -->
                    <div class="mb-3">
                        <label class="form-label">Veterinario</label>
                        <select name="personal" class="form-select" required>
                            <option value="">-- Seleccione un veterinario --</option>
                            <option th:each="v : ${personal}" th:value="${v.id}"
                                    th:text="${v.nombreCompleto} + ' — ' + ${v.cargo}"
                                    th:selected="${historia.personal != null and historia.personal.id == v.id}">
                            </option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('personal')}" th:errors="*{personal}"></div>
                    </div>

                    <!-- Cita asociada (opcional) -->
                    <div class="mb-3">
                        <label class="form-label">Cita asociada (opcional)</label>
                        <select name="citaId" class="form-select">
                            <option value="">-- Consulta directa (sin cita) --</option>
                            <option th:each="c : ${citas}" th:value="${c.id}"
                                    th:text="${c.paciente.nombre} + ' — ' + ${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}"
                                    th:selected="${historia.cita != null and historia.cita.id == c.id}">
                            </option>
                        </select>
                    </div>

                    <!-- Motivo -->
                    <div class="mb-3">
                        <label class="form-label">Motivo de consulta</label>
                        <textarea th:field="*{motivoConsulta}" class="form-control" rows="2" required></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('motivoConsulta')}" th:errors="*{motivoConsulta}"></div>
                    </div>

                    <!-- Diagnóstico -->
                    <div class="mb-3">
                        <label class="form-label">Diagnóstico</label>
                        <textarea th:field="*{diagnostico}" class="form-control" rows="2"></textarea>
                    </div>

                    <!-- Tratamiento -->
                    <div class="mb-3">
                        <label class="form-label">Tratamiento</label>
                        <textarea th:field="*{tratamiento}" class="form-control" rows="2"></textarea>
                    </div>

                    <!-- Observaciones -->
                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>
                        <textarea th:field="*{observaciones}" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Peso (kg)</label>
                            <input type="number" step="0.01" th:field="*{pesoKg}" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Temperatura (°C)</label>
                            <input type="number" step="0.1" th:field="*{temperaturaC}" class="form-control">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Consulta
                        </button>
                        <a th:href="@{/historia}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

</html>
