<html th:replace="~{layout :: page('Historia Clínica', 'historia', ~{::main}, ~{})}"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="fa-solid fa-notes-medical me-2"></i>Historia Clínica
                <span th:if="${paciente != null}" class="text-muted fs-5 fw-normal"
                      th:text="'— ' + ${paciente.nombre}"></span>
            </h2>
            <p class="text-muted small mb-0">Registro de consultas y atenciones veterinarias</p>
        </div>
        <a th:href="@{/historia/nueva}" sec:authorize="hasAnyRole('ADMINISTRADOR','VETERINARIO')"
           class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Nueva Consulta
        </a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${infoMsg}" class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-info-circle me-2"></i><span th:text="${infoMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Buscador y filtro por fecha -->
    <form method="GET" th:action="@{/historia}" class="row g-2 align-items-end mb-3">
        <div class="col-sm-4">
            <label class="form-label small mb-1">Buscar paciente / propietario</label>
            <input type="text" name="buscar" th:value="${buscar}" class="form-control"
                   placeholder="Nombre de paciente o propietario...">
        </div>
        <div class="col-sm-3">
            <label class="form-label small mb-1">Desde</label>
            <input type="date" name="desde" th:value="${desde}"
                   th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" class="form-control">
        </div>
        <div class="col-sm-3">
            <label class="form-label small mb-1">Hasta</label>
            <input type="date" name="hasta" th:value="${hasta}"
                   th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" class="form-control">
        </div>
        <div class="col-sm-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">
                <i class="fa-solid fa-magnifying-glass"></i> Buscar
            </button>
            <a th:if="${(buscar != null and !buscar.isEmpty()) or desde != null or hasta != null}"
               th:href="@{/historia}" class="btn btn-outline-secondary">
                <i class="fa-solid fa-xmark"></i>
            </a>
        </div>
    </form>

    <!-- Tabla de historias clínicas -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(historias)}" class="text-center py-5 text-muted p-4">
                <i class="fa-solid fa-notes-medical fa-3x mb-3"></i>
                <p>No hay registros de historia clínica.</p>
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(historias)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Fecha</th>
                            <th>Paciente</th>
                            <th>Propietario</th>
                            <th>Veterinario</th>
                            <th>Motivo</th>
                            <th>Diagnóstico</th>
                            <th class="text-center pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="h : ${historias}">
                            <td class="ps-4" th:text="${#temporals.format(h.fechaConsulta, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${h.paciente.nombre}"></td>
                            <td th:text="${h.paciente.propietario.nombreCompleto}"></td>
                            <td th:text="${h.personal.nombreCompleto}"></td>
                            <td th:text="${h.motivoConsulta}"></td>
                            <td th:text="${h.diagnostico ?: '—'}"></td>
                            <td class="text-center pe-4">
                                <a th:href="@{/historia/{id}(id=${h.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="fa-solid fa-eye"></i> Ver
                                </a>
                                <form th:action="@{/historia/eliminar/{id}(id=${h.id})}" method="post" class="d-inline"
                                      sec:authorize="hasRole('ADMINISTRADOR')"
                                      onsubmit="return confirm('¿Eliminar esta historia clínica?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</html>
