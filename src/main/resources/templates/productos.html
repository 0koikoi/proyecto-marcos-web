<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Productos - Huellitas</title>
</head>

<body class="bg-light">

<div th:replace="~{layout :: header-mobile}"></div>

<div class="container-fluid">
    <div class="row">

        <nav th:replace="~{layout :: sidebar('productos')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

            <h2 class="fw-bold border-bottom pb-3 mb-4">
                Gestión de Productos
            </h2>

            <!-- FORMULARIO -->
            <div class="card shadow border-0 mb-5">
                <div class="card-body p-4">

                    <h5 class="fw-bold text-success mb-4">
                        Registrar Producto
                    </h5>

                    <form th:action="@{/productos/guardar}"
                          th:object="${nuevoProducto}"
                          method="post"
                          class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label">Nombre</label>
                            <input type="text"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Descripción</label>
                            <input type="text"
                                   th:field="*{descripcion}"
                                   class="form-control">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Precio Compra</label>
                            <input type="number"
                                   step="0.01"
                                   th:field="*{precioCompra}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Precio Venta</label>
                            <input type="number"
                                   step="0.01"
                                   th:field="*{precioVenta}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Stock Actual</label>
                            <input type="number"
                                   th:field="*{stockActual}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Stock Mínimo</label>
                            <input type="number"
                                   th:field="*{stockMinimo}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-12">
                            <button type="submit"
                                    class="btn btn-success px-4">
                                Guardar Producto
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <!-- TABLA -->
            <div class="card shadow border-0">
                <div class="card-body">

                    <h5 class="fw-bold mb-4 text-secondary">
                        Lista de Productos
                    </h5>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Precio Compra</th>
                                <th>Precio Venta</th>
                                <th>Stock</th>
                                <th>Stock Mínimo</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="producto : ${listaProductos}">

                                <td th:text="${producto.id}"></td>
                                <td th:text="${producto.nombre}"></td>
                                <td th:text="${producto.precioCompra}"></td>
                                <td th:text="${producto.precioVenta}"></td>
                                <td th:text="${producto.stockActual}"></td>
                                <td th:text="${producto.stockMinimo}"></td>

                                <td>
                                    <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
                                       class="btn btn-danger btn-sm">
                                        Eliminar
                                    </a>
                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>
                </div>
            </div>

        </main>

    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
