<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Productos - Huellitas</title>
</head>
<body class="bg-light">

<div th:replace="~{layout :: navbar}"></div>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{layout :: sidebar('productos')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <h2 class="fw-bold mb-4 border-bottom pb-3">GESTIÓN DE PRODUCTOS</h2>

            <div class="row">
                <div class="col-lg-4 mb-4">
                    <div class="card p-4 shadow-sm">
                        <h5 class="mb-4">Nuevo Producto</h5>
                        <form th:action="@{/productos/guardar}" th:object="${nuevoProducto}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Nombre del Producto</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">P. Compra</label>
                                    <input type="number" step="0.01" th:field="*{precioCompra}" class="form-control" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">P. Venta</label>
                                    <input type="number" step="0.01" th:field="*{precioVenta}" class="form-control" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-4">
                                    <label class="form-label">Stock Actual</label>
                                    <input type="number" th:field="*{stockActual}" class="form-control" required>
                                </div>
                                <div class="col-6 mb-4">
                                    <label class="form-label">Stock Mínimo</label>
                                    <input type="number" th:field="*{stockMinimo}" class="form-control" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card p-4 shadow-sm">
                        <h5 class="mb-4">Inventario Actual</h5>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>P. Venta</th>
                                    <th>Stock</th>
                                    <th>Acción</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="producto : ${listaProductos}">
                                    <td class="fw-bold" th:text="${producto.nombre}"></td>
                                    <td th:text="'S/ ' + ${producto.precioVenta}"></td>
                                    <td>
                                            <span th:text="${producto.stockActual}"
                                                  th:class="${producto.stockActual <= producto.stockMinimo} ? 'badge bg-danger' : 'badge bg-success'">
                                            </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}" class="btn btn-sm btn-danger">Eliminar</a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
