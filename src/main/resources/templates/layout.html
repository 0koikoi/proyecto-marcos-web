<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - Huellitas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- estilos css aparte-->
    <link th:href="@{/css/style.css}" rel="stylesheet" />

</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="fa-solid fa-paw"></i> Huellitas
        </a>
        <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-user-circle"></i> Administrador
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
                        <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="fa-solid fa-sign-out-alt"></i> Cerrar Sesión</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<nav th:fragment="sidebar(activePage)" class="sidebar">
    <div class="position-sticky pt-3">
        <ul class="nav flex-column gap-1">
            <li class="nav-item">
                <a th:classappend="${activePage == 'dashboard'} ? 'active'" class="nav-link" th:href="@{/dashboard}">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a th:classappend="${activePage == 'propietarios'} ? 'active'" class="nav-link" th:href="@{/propietarios}">
                    <i class="fa-solid fa-users"></i> Clientes
                </a>
            </li>
            <li class="nav-item">
                <a th:classappend="${activePage == 'pacientes'} ? 'active'" class="nav-link" th:href="@{/pacientes}">
                    <i class="fa-solid fa-dog"></i> Pacientes
                </a>
            </li>
            <li class="nav-item">
                <a th:classappend="${activePage == 'citas'} ? 'active'" class="nav-link" th:href="@{/citas}">
                    <i class="fa-solid fa-calendar-check"></i> Citas
                </a>
            </li>
            <li class="nav-item">
                <a th:classappend="${activePage == 'productos'} ? 'active'" class="nav-link" th:href="@{/productos}">
                    <i class="fa-solid fa-box"></i> Inventario
                </a>
            </li>
            <li class="nav-item">
                <a th:classappend="${activePage == 'servicios'} ? 'active'" class="nav-link" th:href="@{/servicios}">
                    <i class="fa-solid fa-briefcase-medical"></i> Servicios
                </a>
            </li>
            <li class="nav-item">
                <a th:classappend="${activePage == 'ventas'} ? 'active'" class="nav-link" th:href="@{/ventas}">
                    <i class="fa-solid fa-cart-shopping"></i> Ventas
                </a>
            </li>
            <li class="nav-item">
                <a th:classappend="${activePage == 'personal'} ? 'active'" class="nav-link" th:href="@{/personal}">
                    <i class="fa-solid fa-user-doctor"></i> Personal
                </a>
            </li>
            <li class="nav-item">
                <a th:classappend="${activePage == 'proveedores'} ? 'active'" class="nav-link" th:href="@{/proveedores}">
                    <i class="fa-solid fa-truck"></i> Proveedores
                </a>
            </li>
        </ul>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
