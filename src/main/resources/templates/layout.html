<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <style>
        .sidebar { min-height: 100vh; z-index: 100; }
        @media (max-width: 767.98px) {
            .sidebar { position: fixed; top: 0; left: 0; width: 100%; height: auto; }
        }
    </style>
</head>
<body>

<header th:fragment="header-mobile" class="navbar navbar-dark sticky-top bg-dark p-2 shadow d-md-none">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">SISTEMA VET</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</header>

<nav th:fragment="sidebar(activePage)" id="sidebarMenu"
     class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse p-3 shadow">
    <h5 class="text-white fw-bold text-center border-bottom pb-3 d-none d-md-block">SISTEMA VET</h5>
<ul class="nav flex-column gap-2 mt-3">

    <li class="nav-item">
        <a th:href="@{/dashboard}" class="nav-link text-white"
           th:classappend="${activePage == 'dashboard'} ? 'bg-primary active' : ''">
            Dashboard
        </a>
    </li>

    <li class="nav-item">
        <a th:href="@{/pacientes}" class="nav-link text-white"
           th:classappend="${activePage == 'pacientes'} ? 'bg-primary active' : ''">
            Pacientes
        </a>
    </li>

    <li class="nav-item">
        <a th:href="@{/personal}" class="nav-link text-white"
           th:classappend="${activePage == 'personal'} ? 'bg-primary active' : ''">
            Personal Staff
        </a>
    </li>

<!-- MÓDULO PROVEEDORES -->
<li class="nav-item">
    <a th:href="@{/proveedores}" 
       class="nav-link text-white"
       th:classappend="${activePage == 'proveedores'} ? 'bg-primary active' : ''">
        Proveedores
    </a>
</li>

<!-- MÓDULO PRODUCTOS -->
<li class="nav-item">
    <a th:href="@{/productos}" 
       class="nav-link text-white"
       th:classappend="${activePage == 'productos'} ? 'bg-primary active' : ''">
        Productos
    </a>
</li>

    <li>
        <a th:href="@{/logout}" class="nav-link text-danger mt-4 pt-3 border-top fw-bold">
            Cerrar Sesión
        </a>
    </li>
</ul>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
