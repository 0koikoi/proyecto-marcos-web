<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet" />

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; z-index: 100; background-color: #ffffff; border-right: 1px solid #eaeaea; }
        .nav-link { color: #6c757d; font-weight: 500; padding: 10px 15px; border-radius: 8px; margin-bottom: 5px; transition: all 0.2s ease;}
        .nav-link:hover { background-color: #f1f3f5; color: #212529; }
        .nav-link.active { background-color: #eef2ff; color: #4f46e5; font-weight: 600; }
        .menu-header { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #adb5bd; margin-top: 1.5rem; margin-bottom: 0.5rem; padding-left: 15px;}

        @media (max-width: 767.98px) {
            .sidebar { position: fixed; top: 0; left: -100%; width: 250px; height: 100%; transition: left 0.3s ease; }
            .sidebar.show { left: 0; }
            /* Overlay oscuro para el móvil */
            .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 99;}
            .sidebar-overlay.show { display: block; }
        }
    </style>
</head>
<body>

<header th:fragment="header-mobile" class="navbar navbar-light sticky-top bg-white p-3 shadow-sm d-md-none border-bottom">
    <div class="container-fluid d-flex justify-content-between">
        <a class="navbar-brand fw-bold" style="color: #4f46e5;" href="#">HUELLITAS.</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</header>

<nav th:fragment="sidebar(activePage)" id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
    <h4 class="fw-bold text-center border-bottom pb-4 mb-4 d-none d-md-block" style="color: #4f46e5; letter-spacing: -0.5px;">Huellitas.</h4>

    <ul class="nav flex-column">
        <li class="nav-item">
            <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                <i class="fas fa-home me-2 w-20px"></i> Dashboard
            </a>
        </li>

        <div class="menu-header">Recepción</div>
        <li class="nav-item">
            <a th:href="@{/citas}" class="nav-link" th:classappend="${activePage == 'citas'} ? 'active' : ''">
                <i class="far fa-calendar-alt me-2"></i> Citas Médicas
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/propietarios}" class="nav-link" th:classappend="${activePage == 'propietarios'} ? 'active' : ''">
                <i class="far fa-user me-2"></i> Propietarios
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/pacientes}" class="nav-link" th:classappend="${activePage == 'pacientes'} ? 'active' : ''">
                <i class="fas fa-paw me-2"></i> Pacientes
            </a>
        </li>

        <div class="menu-header">Catálogo & Clínica</div>
        <li class="nav-item">
            <a th:href="@{/servicios}" class="nav-link" th:classappend="${activePage == 'servicios'} ? 'active' : ''">
                <i class="fas fa-stethoscope me-2"></i> Servicios
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/productos}" class="nav-link" th:classappend="${activePage == 'productos'} ? 'active' : ''">
                <i class="fas fa-box me-2"></i> Productos
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/proveedores}" class="nav-link" th:classappend="${activePage == 'proveedores'} ? 'active' : ''">
                <i class="fas fa-truck me-2"></i> Proveedores
            </a>
        </li>

        <div class="menu-header">Caja & Sistema</div>
        <li class="nav-item">
            <a th:href="@{/ventas}" class="nav-link" th:classappend="${activePage == 'ventas'} ? 'active' : ''">
                <i class="fas fa-cash-register me-2"></i> Ventas / Caja
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/personal}" class="nav-link" th:classappend="${activePage == 'personal'} ? 'active' : ''">
                <i class="fas fa-user-md me-2"></i> Personal
            </a>
        </li>

        <li class="nav-item mt-4">
            <a th:href="@{/logout}" class="nav-link text-danger" style="background-color: #fff5f5;">
                <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
            </a>
        </li>
    </ul>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Script simple para cerrar el menú móvil al hacer clic fuera
        document.addEventListener('DOMContentLoaded', function() {
            // Se puede extender si necesitas el overlay oscuro en móviles
        });
    </script>
</div>
</body>
</html>
