<html th:replace="~{layout :: page('Nueva Venta', 'ventas', ~{::main}, ~{::#custom-scripts})}">
<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <a th:href="@{/ventas}" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0">Nueva Venta</h2>
    </div>

    <div th:replace="~{layout :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm border-0 p-4">

                <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post" id="formVenta">

                    <!-- DATOS GENERALES -->
                    <h6 class="fw-bold text-muted mb-3 pb-2 border-bottom">
                        <i class="fa-solid fa-receipt me-1"></i> Datos de la Venta
                    </h6>
                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Vendedor (Personal) *</label>
                            <select th:field="*{personal}" class="form-select" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option th:each="p : ${personal}" th:value="${p.id}" th:text="${p.nombreCompleto}"></option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Cliente (Opcional)</label>
                            <select th:field="*{propietario}" class="form-select">
                                <option value="">-- Público General --</option>
                                <option th:each="c : ${propietarios}" th:value="${c.id}" th:text="${c.nombreCompleto + ' (' + c.dni + ')'}"></option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Método de Pago *</label>
                            <select th:field="*{tipoPago}" class="form-select" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="YAPE">Yape</option>
                                <option value="PLIN">Plin</option>
                                <option value="TARJETA_BCP">Tarjeta - BCP</option>
                                <option value="TARJETA_BBVA">Tarjeta - BBVA</option>
                                <option value="TARJETA_INTERBANK">Tarjeta - Interbank</option>
                                <option value="TARJETA_SCOTIABANK">Tarjeta - Scotiabank</option>
                                <option value="TRANSFERENCIA">Transferencia bancaria</option>
                            </select>
                        </div>
                    </div>

                    <!-- DETALLES DE PRODUCTOS Y SERVICIOS -->
                    <div class="d-flex justify-content-between align-items-end mb-3 pb-2 border-bottom">
                        <h6 class="fw-bold text-muted m-0">
                            <i class="fa-solid fa-box me-1"></i> Detalle (Productos y Servicios)
                        </h6>
                        <button type="button" class="btn btn-sm btn-success" id="btnAgregarProducto">
                            <i class="fa-solid fa-plus"></i> Agregar Fila
                        </button>
                    </div>

                    <div class="table-responsive mb-4">
                        <table class="table table-bordered align-middle" id="tablaDetalles">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto / Servicio</th>
                                    <th width="15%">Precio Unit. (S/)</th>
                                    <th width="15%">Cantidad</th>
                                    <th width="15%">Subtotal (S/)</th>
                                    <th width="5%"></th>
                                </tr>
                            </thead>
                            <tbody id="tbodyDetalles">
                                <!-- Filas dinámicas se insertan aquí -->
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3" class="text-end fw-bold">TOTAL VENTA:</td>
                                    <td class="fw-bold text-success fs-5">S/ <span id="lblTotal">0.00</span></td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/ventas}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4" id="btnSubmit">
                            <i class="fa-solid fa-save me-1"></i> Registrar Venta
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Template oculto para las filas: agrupa productos (con stock) y servicios (sin stock) -->
    <select id="itemTemplate" style="display:none;">
        <option value="" disabled selected data-tipo="" data-precio="0" data-stock="">Seleccione...</option>
        <optgroup label="Productos">
            <option th:each="prod : ${productos}"
                    th:value="${'P-' + prod.id}"
                    th:data-tipo="PRODUCTO"
                    th:data-id="${prod.id}"
                    th:data-precio="${prod.precioVenta}"
                    th:data-stock="${prod.stockActual}"
                    th:text="${prod.nombre + ' (Stock: ' + prod.stockActual + ')'}">
            </option>
        </optgroup>
        <optgroup label="Servicios">
            <option th:each="serv : ${servicios}" th:if="${serv.activo}"
                    th:value="${'S-' + serv.id}"
                    th:data-tipo="SERVICIO"
                    th:data-id="${serv.id}"
                    th:data-precio="${serv.precio}"
                    th:data-stock=""
                    th:text="${serv.nombre}">
            </option>
        </optgroup>
    </select>
</main>

<div id="custom-scripts">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tbody = document.getElementById('tbodyDetalles');
            const btnAgregar = document.getElementById('btnAgregarProducto');
            const templateOptions = document.getElementById('itemTemplate').innerHTML;
            const lblTotal = document.getElementById('lblTotal');

            function calcularTotal() {
                let total = 0;
                document.querySelectorAll('.fila-producto').forEach(fila => {
                    const precio = parseFloat(fila.querySelector('.precio-unitario').value) || 0;
                    const cantidad = parseInt(fila.querySelector('.input-cantidad').value) || 0;
                    const subtotal = precio * cantidad;
                    fila.querySelector('.subtotal-txt').textContent = subtotal.toFixed(2);
                    total += subtotal;
                });
                lblTotal.textContent = total.toFixed(2);
            }

            function agregarFila() {
                const tr = document.createElement('tr');
                tr.className = 'fila-producto';
                tr.innerHTML = `
                    <td>
                        <select class="form-select select-producto" required>
                            <option value="" disabled selected>Seleccione producto/servicio...</option>
                            ${templateOptions}
                        </select>
                        <input type="hidden" class="input-item-id" name="itemIds">
                        <input type="hidden" class="input-tipo-item" name="tiposItem">
                    </td>
                    <td>
                        <input type="number" class="form-control precio-unitario" name="precios" step="0.01" min="0" required readonly>
                        <div class="text-danger small d-none stock-warning mt-1"><i class="fa-solid fa-triangle-exclamation"></i> Stock insuficiente</div>
                    </td>
                    <td>
                        <input type="number" class="form-control input-cantidad" name="cantidades" min="1" value="1" required>
                    </td>
                    <td class="text-center fw-semibold text-secondary align-middle">
                        S/ <span class="subtotal-txt">0.00</span>
                    </td>
                    <td class="text-center align-middle">
                        <button type="button" class="btn btn-sm btn-outline-danger btn-eliminar" title="Quitar">
                            <i class="fa-solid fa-times"></i>
                        </button>
                    </td>
                `;

                const select = tr.querySelector('.select-producto');
                const inputId = tr.querySelector('.input-item-id');
                const inputTipo = tr.querySelector('.input-tipo-item');
                const inputPrecio = tr.querySelector('.precio-unitario');
                const inputCant = tr.querySelector('.input-cantidad');
                const warning = tr.querySelector('.stock-warning');

                select.addEventListener('change', function() {
                    const option = this.options[this.selectedIndex];
                    const id = option.dataset.id;
                    const tipo = option.dataset.tipo;
                    const precio = option.dataset.precio;
                    
                    inputId.value = id;
                    inputTipo.value = tipo;
                    inputPrecio.value = precio;
                    
                    // Reset warnings
                    warning.classList.add('d-none');
                    inputCant.classList.remove('is-invalid');
                    inputCant.max = tipo === 'PRODUCTO' ? option.dataset.stock : '';
                    
                    calcularTotal();
                });

                inputCant.addEventListener('input', function() {
                    const maxStock = parseInt(this.max);
                    if (maxStock && parseInt(this.value) > maxStock) {
                        warning.classList.remove('d-none');
                        this.classList.add('is-invalid');
                    } else {
                        warning.classList.add('d-none');
                        this.classList.remove('is-invalid');
                    }
                    calcularTotal();
                });

                tr.querySelector('.btn-eliminar').addEventListener('click', function() {
                    tr.remove();
                    calcularTotal();
                });

                tbody.appendChild(tr);
            }

            agregarFila();
            btnAgregar.addEventListener('click', agregarFila);

            document.getElementById('formVenta').addEventListener('submit', function(e) {
                const filas = document.querySelectorAll('.fila-producto');
                if (filas.length === 0) {
                    e.preventDefault();
                    alert('Debe agregar al menos un producto o servicio a la venta.');
                    return;
                }
                for (const fila of filas) {
                    if (!fila.querySelector('.input-item-id').value) {
                        e.preventDefault();
                        alert('Hay una fila sin producto/servicio seleccionado.');
                        return;
                    }
                }
                if (document.querySelectorAll('.is-invalid').length > 0) {
                    e.preventDefault();
                    alert('Corrija las cantidades que exceden el stock disponible.');
                }
            });
        });
    </script>
</div>
</html>
