<html th:replace="~{layout :: page('Solicitudes de Material', 'solicitudes', ~{::main}, ~{})}"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<main>
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="fa-solid fa-boxes-stacked me-2"></i>Solicitudes de Material
            </h2>
            <p class="text-muted small mb-0">
                <span sec:authorize="hasRole('ADMINISTRADOR')">Administrar solicitudes del equipo veterinario</span>
                <span sec:authorize="hasRole('VETERINARIO')">Mis solicitudes de material e insumos</span>
            </p>
        </div>
        <a th:href="@{/solicitudes/nueva}" sec:authorize="hasAnyRole('ADMINISTRADOR','VETERINARIO')"
           class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Nueva Solicitud
        </a>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!--
    TODO: Implementar tabla con solicitudes.
    COLUMNAS: Fecha | Solicitante | Producto | Cant. Solicitada | Motivo | Estado | Acciones

    ESTADOS con badge:
        PENDIENTE  → badge bg-warning text-dark
        APROBADA   → badge bg-primary
        ENTREGADA  → badge bg-success
        RECHAZADA  → badge bg-danger

    BOTONES (todos POST con CSRF):
        Aprobar:   <form method="post" th:action="@{/solicitudes/aprobar/{id}(id=${s.id})}">
        Rechazar:  <form method="post" th:action="@{/solicitudes/rechazar/{id}(id=${s.id})}">
        Entregar:  <form method="post" th:action="@{/solicitudes/entregar/{id}(id=${s.id})}">
        Cada form debe incluir: <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    MODAL PARA MOTIVO DE RECHAZO:
        Al hacer clic en "Rechazar", mostrar un modal Bootstrap con textarea.
        El motivo es OBLIGATORIO (param motivoRechazo en el controller).

    MODAL PARA CANTIDAD ENTREGADA:
        Al hacer clic en "Marcar entregada", pedir cantidadEntregada (puede ser menor).
    -->

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="alert alert-warning mb-0">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>
                <strong>Módulo en construcción.</strong>
                Implementar la tabla en <code>SolicitudMaterialController.java</code>.
            </div>
        </div>
    </div>
</main>

</html>
