<html th:replace="~{layout :: page('Nueva Solicitud de Material', 'solicitudes', ~{::main}, ~{})}"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <a th:href="@{/solicitudes}" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0">
            <i class="fa-solid fa-boxes-stacked me-2"></i> Nueva Solicitud de Material
        </h2>
    </div>

    <!--
    TODO: Implementar formulario de solicitud de material.

    CAMPOS:
        - producto_id         → select de productos activos del inventario
        - cantidad_solicitada → input number (min=1)
        - motivo              → textarea, obligatorio (justificar el uso del material)

    ESTRUCTURA:
        <form th:action="@{/solicitudes/guardar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label for="productoId">Producto / Insumo *</label>
                <select id="productoId" name="productoId" class="form-select" required>
                    <option value="">Seleccionar producto...</option>
                    <option th:each="p : ${productos}"
                            th:value="${p.id}"
                            th:text="${p.nombre + ' (Stock: ' + p.stockActual + ')'}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="cantidad">Cantidad solicitada *</label>
                <input type="number" id="cantidad" name="cantidadSolicitada"
                       min="1" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="motivo">Motivo de la solicitud *</label>
                <textarea id="motivo" name="motivo" rows="3" class="form-control" required
                          placeholder="Describa para qué necesita este material"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
            <a th:href="@{/solicitudes}" class="btn btn-outline-secondary ms-2">Cancelar</a>
        </form>

    NOTA IMPORTANTE:
        El solicitante se asigna en el CONTROLLER desde el SecurityContext,
        NO se pone en el formulario (evitar manipulación):
            Personal solicitante = (Personal) authentication.getPrincipal();
            solicitud.setSolicitante(solicitante);
    -->

    <div class="alert alert-warning">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <strong>Módulo en construcción.</strong>
        Implementar el formulario en <code>SolicitudMaterialController.java</code>.
    </div>
    <a th:href="@{/solicitudes}" class="btn btn-outline-secondary">
        <i class="fa-solid fa-arrow-left me-1"></i> Volver
    </a>
</main>

</html>
