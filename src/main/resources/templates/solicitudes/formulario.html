<html th:replace="~{layout :: page('Nueva Solicitud de Material', 'solicitudes', ~{::main}, ~{})}"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<main>
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <a th:href="@{/solicitudes}" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="fw-bold m-0">
            <i class="fa-solid fa-boxes-stacked me-2"></i> Nueva Solicitud de Material
        </h2>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form th:action="@{/solicitudes/guardar}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="productoId" class="form-label fw-bold">Producto / Insumo *</label>
                    <select id="productoId" name="producto.id" class="form-select" required>
                        <option value="">Seleccionar producto...</option>
                        <option th:each="p : ${productos}"
                                th:value="${p.id}"
                                th:text="${p.nombre + ' (Stock: ' + p.stockActual + ')'}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="cantidad" class="form-label fw-bold">Cantidad solicitada *</label>
                    <input type="number" id="cantidad" name="cantidadSolicitada"
                           min="1" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="motivo" class="form-label fw-bold">Motivo de la solicitud *</label>
                    <textarea id="motivo" name="motivo" rows="3" class="form-control" required
                              placeholder="Describa para qué necesita este material"></textarea>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-paper-plane me-1"></i> Enviar Solicitud
                    </button>
                    <a th:href="@{/solicitudes}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
</html>
